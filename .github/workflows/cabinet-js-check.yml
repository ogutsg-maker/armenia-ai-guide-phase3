name: cabinet-js-check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract inline script
        run: |
          python -c "import re,pathlib; s=pathlib.Path('web_apps/master_cabinet.html').read_text(); b=re.findall(r'<script(?:\\s[^>]*)?>([\\s\\S]*?)</script>',s,re.I); print(len(b)); pathlib.Path('/tmp/cabinet.js').write_text(b[-1])"
      - name: Syntax check
        run: node --check /tmp/cabinet.js