name: cabinet-js-check
on:
  workflow_dispatch:
  push:
    paths: [web_apps/master_cabinet.html]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python - <<'PY'
          from pathlib import Path
          import re
          s=Path("web_apps/master_cabinet.html").read_text()
          blocks=re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>",s,re.I)
          print("scripts",len(blocks))
          Path("/tmp/cabinet.js").write_text(blocks[-1])
        PY
      - run: node --check /tmp/cabinet.js