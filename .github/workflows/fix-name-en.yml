name: One-time DB compatibility fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add missing catalog columns
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('partner_directions_api.py')
          s = p.read_text(encoding='utf-8')
          old = '''    ALTER TABLE master_categories ADD COLUMN IF NOT EXISTS is_active BOOLEAN NOT NULL DEFAULT TRUE;\n'''
          new = '''    ALTER TABLE master_categories ADD COLUMN IF NOT EXISTS is_active BOOLEAN NOT NULL DEFAULT TRUE;\n    ALTER TABLE master_categories ADD COLUMN IF NOT EXISTS name_en TEXT;\n    ALTER TABLE categories ADD COLUMN IF NOT EXISTS name_en TEXT;\n'''
          if 'ALTER TABLE master_categories ADD COLUMN IF NOT EXISTS name_en TEXT;' not in s:
              if old not in s:
                  raise SystemExit('migration anchor not found')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          else:
              print('columns migration already present')
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add partner_directions_api.py
          git rm .github/workflows/fix-name-en.yml
          git diff --cached --quiet || git commit -m 'fix: ensure catalog name_en columns exist'
          git push
