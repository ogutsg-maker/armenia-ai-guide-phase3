name: temporary-js-check
on:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check master cabinet JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("web_apps/master_cabinet.html").read_text()
          scripts=re.findall(r"<script(?:\s[^>]*)?>([\\s\\S]*?)</script>", s, re.I)
          Path("/tmp/master_cabinet.js").write_text(scripts[-1])
          PY
          node --check /tmp/master_cabinet.js