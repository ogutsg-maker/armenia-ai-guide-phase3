name: Fix admin confirmation state machine

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-admin-confirmation:
    if: "!contains(github.event.head_commit.message, '[admin-confirmation-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch ADMIN confirmation dispatcher
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("ai_manager.py")
          text = path.read_text(encoding="utf-8")

          pattern = re.compile(
              r'            if pending_state == "awaiting_confirmation":\n'
              r'.*?'
              r'            if pending_state == "collecting_data" and role == ContextType.PARTNER:',
              re.S,
          )

          replacement = '''            if pending_state == "awaiting_confirmation":
                if self._is_confirmation(message):
                    pending_name = str(pending.get("name") or "").strip()
                    pending_args = dict(pending.get("args") or {})
                    is_partner_submission = (
                        role == ContextType.PARTNER
                        and pending_name in {"add_service", "add_services"}
                    )

                    try:
                        confirm_tools = ToolRegistry(
                            telegram_id=int(telegram_id),
                            context_type=role,
                            trusted_context=trusted,
                            session_state=state.to_dict(),
                        )

                        # Only a partner service/application submission receives
                        # the idempotent SUBMITTED marker. Admin actions have their
                        # own lifecycle and must never be converted into a
                        # "submitted application" state.
                        if is_partner_submission:
                            pending["status"] = "SUBMITTED"
                            pending["state"] = "submitted"
                            pending["submission_token"] = str(
                                pending.get("submission_token") or secrets.token_urlsafe(24)
                            )
                            pending_args["submission_token"] = pending["submission_token"]
                            pending["args"] = pending_args
                            await self._update_session_context(
                                telegram_id, role, {"pending_action": pending}
                            )

                        result = await confirm_tools.execute_confirmed(
                            pending_name, pending_args
                        )

                        # A successful action consumes the confirmation state.
                        # Repeated "yes" therefore cannot execute the same action
                        # a second time.
                        await self._clear_pending(telegram_id, role)

                        if is_partner_submission:
                            application_id = (
                                result.get("application_id")
                                if isinstance(result, dict) else None
                            )
                            reply = (
                                "⏳ Հայտը ուղարկվեց ստուգման։" if language == "hy"
                                else "⏳ Заявка отправлена на проверку."
                                if language == "ru"
                                else "⏳ The application was sent for review."
                            )
                        elif pending_name == "admin_approve_application_document":
                            reply = (
                                "✅ Փաստաթուղթը հաստատվեց։ Հայտը դեռ սպասում է վերջնական ադմինիստրատիվ հաստատմանը։"
                                if language == "hy"
                                else "✅ Документ подтверждён. Заявка остаётся в ожидании окончательного решения администратора."
                                if language == "ru"
                                else "✅ The document was approved. The application remains pending final administrator approval."
                            )
                        elif pending_name == "admin_approve_application":
                            reply = (
                                "✅ Հայտը հաստատվեց։ Ծառայությունները կարող են ակտիվացվել։"
                                if language == "hy"
                                else "✅ Заявка подтверждена. Услуги могут быть активированы."
                                if language == "ru"
                                else "✅ The application was approved. Services can be activated."
                            )
                        elif pending_name == "admin_reject_application":
                            reply = (
                                "✅ Հայտը մերժվեց։"
                                if language == "hy"
                                else "✅ Заявка отклонена."
                                if language == "ru"
                                else "✅ The application was rejected."
                            )
                        elif pending_name == "admin_request_document_correction":
                            reply = (
                                "✅ Գործընկերոջը ուղարկվել է փաստաթուղթը փոխարինելու պահանջը։"
                                if language == "hy"
                                else "✅ Партнёру отправлен запрос на замену документа."
                                if language == "ru"
                                else "✅ The partner was asked to replace the document."
                            )
                        elif pending_name == "admin_apply_catalog_resolution":
                            reply = (
                                "✅ Կատեգորիաները կիրառվեցին։"
                                if language == "hy"
                                else "✅ Категории применены."
                                if language == "ru"
                                else "✅ Categories applied."
                            )
                        else:
                            reply = self._done_text(language)

                        await self._save_history(
                            telegram_id, role, "ai", reply,
                            {
                                "confirmed_action": pending,
                                "tool_result": result,
                                "fast_path": True,
                            },
                        )
                        return {
                            "reply": reply,
                            "tool_result": result,
                            "confirmed": True,
                            "fast_path": True,
                        }

                    except Exception as exc:
                        # Keep the pending action for a retry when the backend
                        # failed before a successful write. Do not claim success.
                        logger.exception("Pending confirmation execution failed")
                        reply = self._error_text(language)
                        await self._save_history(
                            telegram_id, role, "ai", reply,
                            {
                                "confirmed_action": pending,
                                "error": str(exc)[:1000],
                                "fast_path": True,
                            },
                        )
                        return {
                            "reply": reply,
                            "confirmed": False,
                            "confirmation_required": True,
                            "fast_path": True,
                            "error": str(exc)[:240],
                        }

                reply = (
                    "Նախ հաստատեք կամ չեղարկեք պատրաստված հայտը։"
                    if language == "hy"
                    else "Сначала подтвердите или отмените подготовленную заявку."
                    if language == "ru"
                    else "Please confirm or cancel the prepared application."
                )
                return {"reply": reply, "confirmation_pending": True, "fast_path": True}

            if pending_state == "collecting_data" and role == ContextType.PARTNER:'''

          new_text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("Expected ADMIN confirmation block was not found")
          path.write_text(new_text, encoding="utf-8")
          print("Patched ai_manager.py")

          # Compile-check the edited module immediately.
          compile(new_text, str(path), "exec")
          print("ai_manager.py syntax OK")
          PY

      - name: Run focused syntax checks
        run: |
          python -m py_compile ai_manager.py tool_registry.py data_core.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_manager.py
          git diff --cached --check
          git commit -m "Fix admin confirmation state machine [admin-confirmation-fix]"
          git push
