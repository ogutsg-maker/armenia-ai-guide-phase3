# Marketplace Bot — Docker Compose
# Использование:
#   1. Скопировать .env.example в .env и заполнить
#   2. docker compose up -d
#   3. docker compose logs -f

services:
  bot:
    build: .
    container_name: marketplace_bot
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"   # Web App + API
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
