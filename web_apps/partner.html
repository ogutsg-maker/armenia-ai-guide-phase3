<!doctype html>
<html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Armenia AI Guide — Partner</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#080c18;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:820px;margin:auto;padding:16px 12px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.brand{font-size:21px;font-weight:800}.sub{font-size:9px;letter-spacing:.2em;color:#9da8bc;margin-top:3px}
.back{background:#ffffff10;border:1px solid #ffffff18;color:#fff;border-radius:12px;padding:9px 12px}.panel{background:#ffffff08;border:1px solid #ffffff12;border-radius:22px;overflow:hidden}
.head{padding:18px;border-bottom:1px solid #ffffff10}.head h1{margin:0 0 6px;font-size:23px}.muted{color:#aeb7c8;line-height:1.45;font-size:14px}
.chat{max-height:48vh;min-height:220px;overflow:auto;padding:16px}.msg{max-width:90%;padding:12px 14px;border-radius:17px;margin-bottom:10px;white-space:pre-wrap;line-height:1.45;font-size:14px}.ai{background:#ffffff0d;border-top-left-radius:5px}.user{margin-left:auto;background:#6257d8;border-top-right-radius:5px}
.composer{padding:10px;border-top:1px solid #ffffff10;display:flex;gap:8px}textarea{flex:1;min-height:48px;max-height:130px;resize:none;background:#ffffff0b;border:1px solid #ffffff18;border-radius:14px;color:#fff;padding:12px;font:inherit;outline:0}
.send{width:54px;border:0;border-radius:14px;background:#9d8cff;color:#07101d;font-weight:800}.status{padding:10px;text-align:center;color:#aeb7c8;font-size:12px}.error{color:#ffb4b4}.hidden{display:none!important}
.form{padding:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:620px){.grid{grid-template-columns:1fr}}
label{display:block;color:#cbd3e1;font-size:12px;margin:0 0 5px}.field{margin-bottom:11px}input,select{width:100%;height:44px;background:#ffffff0b;border:1px solid #ffffff18;border-radius:12px;color:#fff;padding:10px;font:inherit;outline:0}select option{background:#111827;color:#fff}
.section{border-top:1px solid #ffffff10;padding-top:14px;margin-top:14px}.section h3{margin:0 0 10px;font-size:16px}.hint{font-size:12px;color:#8f9aae;margin-bottom:10px}
.service{border:1px solid #ffffff14;border-radius:12px;padding:8px;margin-bottom:7px}.service-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(110px,.8fr) minmax(120px,.8fr) 34px;gap:6px;align-items:end}.service label{font-size:11px;margin-bottom:3px}.service input,.service select{height:40px;padding:8px;font-size:13px}.service .smallbtn{height:40px;padding:8px 9px}@media(max-width:620px){.service-grid{grid-template-columns:minmax(0,1fr) minmax(90px,.75fr) 34px}.service-grid>div:nth-child(3){grid-column:1/3}.service-grid .wide,.service-grid .scwrap{grid-column:auto}}
.smallbtn,.primary{border:0;border-radius:12px;padding:10px 13px;font-weight:800;cursor:pointer}.smallbtn{background:#ffffff12;color:#fff}.primary{width:100%;margin-top:10px;height:48px;background:#9d8cff;color:#07101d}.danger{background:#ff5f6d22;color:#ffb4b4}
.doc{border:1px solid #ffffff14;border-radius:14px;padding:12px}.doc input{height:auto;padding:8px 0;border:0;background:transparent}.file-input{position:absolute!important;width:1px!important;height:1px!important;opacity:0!important;pointer-events:none}.file-picker{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;border:1px dashed #ffffff30;border-radius:13px;background:#ffffff08;color:#fff;cursor:pointer;font-weight:800;margin:10px 0}.file-picker small{color:#8f9aae;font-weight:500}.required-badge{font-size:10px;color:#f1d38a;border:1px solid #f0c75e44;background:#f0c75e12;border-radius:999px;padding:4px 7px;vertical-align:middle}.submit-note{font-size:12px;color:#8f9aae;margin-top:12px;line-height:1.45}.notice{border:1px solid #f0c75e44;background:#f0c75e12;border-radius:12px;padding:10px;color:#e9d79a;font-size:12px;margin-bottom:12px}
</style></head><body>
<div class="wrap"><div class="top"><div><div class="brand">✦ Armenia AI Guide</div><div class="sub">ARMENIA · AI CONCIERGE</div></div><button class="back" onclick="try{Telegram.WebApp.close()}catch(e){history.back()}">‹</button></div>
<div id="app-container" class="panel"><div class="head"><h1>🏢 Գրանցել ձեր բիզնեսը</h1><div class="muted">Գրանցումը սկսվում է երկու պարզ տվյալից։ Մնացած տվյալները կարող եք լրացնել արդեն գործընկերոջ կաբինետում։</div></div>
<div id="registration" class="form"></div><div id="status" class="status"></div></div></div>
<script>
const tg=window.Telegram?.WebApp;
const initData=tg?.initData||"";
const statusEl=document.getElementById("status");
const registration=document.getElementById("registration");
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
async function jsonResponse(r){const text=await r.text();try{return JSON.parse(text)}catch(e){throw new Error("HTTP "+r.status+(text?" — "+text.replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim().slice(0,200):""))}}
async function api(path,body,method="POST"){
  const opt={method,headers:{"X-Telegram-Init-Data":initData}};
  if(body!==undefined){opt.headers["Content-Type"]="application/json";opt.body=JSON.stringify(body)}
  const r=await fetch(path,opt);const d=await jsonResponse(r);
  if(!r.ok||d.ok===false)throw new Error(d.detail||d.message||d.error||("HTTP "+r.status));
  return d;
}
function renderPureRegistrationForm(){
  registration.innerHTML='<div class="notice">Գրանցման առաջին քայլում անհրաժեշտ է միայն բիզնեսի անունը և հեռախոսահամարը։</div>'+
    '<div class="grid">'+
    '<div class="field"><label>Բիզնեսի անվանումը *</label><input id="biz_name" maxlength="100" autocomplete="organization" placeholder="Օրինակ՝ BYUTI գեղեցկության սրահ"></div>'+
    '<div class="field"><label>Հեռախոսահամար *</label><input id="biz_phone" maxlength="20" inputmode="tel" autocomplete="tel" placeholder="+374 XX XX XX XX"></div>'+
    '</div>'+
    '<button id="btn-register" class="primary">✓ Գրանցվել</button>';
  document.getElementById("btn-register").addEventListener("click",registerPartner);
}
async function registerPartner(){
  const button=document.getElementById("btn-register");
  const name=document.getElementById("biz_name").value.trim();
  const phone=document.getElementById("biz_phone").value.trim();
  statusEl.textContent="";
  if(!name||!phone){statusEl.innerHTML='<span class="error">Խնդրում ենք լրացնել բոլոր դաշտերը։</span>';return}
  button.disabled=true;button.textContent="Գրանցում…";
  try{
    const result=await api("/api/webapp/partner/register",{business_name:name,phone});
    if(result.ok){window.location.href="/master_cabinet.html";return}
  }catch(e){
    statusEl.innerHTML='<span class="error">⚠️ '+esc(e.message||"Գրանցման սխալ")+'</span>';
    button.disabled=false;button.textContent="✓ Գրանցվել";
  }
}
try{if(tg?.ready)tg.ready();if(tg?.expand)tg.expand()}catch(e){}
if(!initData){statusEl.innerHTML='<span class="error">Բացեք այս բաժինը Telegram հավելվածում։</span>'}
renderPureRegistrationForm();
</script></body></html>
