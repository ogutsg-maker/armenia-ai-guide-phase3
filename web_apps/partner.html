<!doctype html>
<html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Armenia AI Guide — Partner</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#080c18;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.wrap{max-width:760px;margin:auto;padding:16px 12px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{font-size:21px;font-weight:800}.sub{font-size:9px;letter-spacing:.2em;color:#9da8bc;margin-top:3px}.back{background:#ffffff10;border:1px solid #ffffff18;color:#fff;border-radius:12px;padding:9px 12px}.panel{background:#ffffff08;border:1px solid #ffffff12;border-radius:22px;overflow:hidden}.head{padding:18px;border-bottom:1px solid #ffffff10}.head h1{margin:0 0 6px;font-size:23px}.muted{color:#aeb7c8;line-height:1.45;font-size:14px}.chat{height:min(62vh,620px);min-height:400px;overflow:auto;padding:16px}.msg{max-width:90%;padding:12px 14px;border-radius:17px;margin-bottom:10px;white-space:pre-wrap;line-height:1.45;font-size:14px}.ai{background:#ffffff0d;border-top-left-radius:5px}.user{margin-left:auto;background:#6257d8;border-top-right-radius:5px}.composer{padding:10px;border-top:1px solid #ffffff10;display:flex;gap:8px}textarea{flex:1;min-height:48px;max-height:130px;resize:none;background:#ffffff0b;border:1px solid #ffffff18;border-radius:14px;color:#fff;padding:12px;font:inherit;outline:0}.send{width:54px;border:0;border-radius:14px;background:#9d8cff;color:#07101d;font-weight:800}.status{padding:10px;text-align:center;color:#aeb7c8;font-size:12px}.error{color:#ffb4b4}.done{display:none;padding:16px}.box{border:1px solid #78ffb033;background:#50dc9614;border-radius:16px;padding:15px}.upload{margin-top:14px}.upload input{width:100%;margin-top:8px;color:#ddd}.primary{width:100%;height:46px;margin-top:10px;border:0;border-radius:14px;background:#9d8cff;color:#07101d;font-weight:800}.hidden{display:none!important}</style></head><body><div class="wrap"><div class="top"><div><div class="brand">✦ Armenia AI Guide</div><div class="sub">ARMENIA · AI CONCIERGE</div></div><button class="back" onclick="try{Telegram.WebApp.close()}catch(e){history.back()}">‹</button></div><div class="panel"><div class="head"><h1>🏢 Գործընկերոջ AI գրանցում</h1><div class="muted">Պատմեք ձեր բիզնեսի մասին ազատ ձևով։ AI-ը ինքնուրույն կհավաքի հայտը։</div></div><div id="chat" class="chat"></div><div id="composer" class="composer"><textarea id="input" placeholder="Օրինակ՝ ունեմ գեղեցկության սրահ Երևանում..."></textarea><button id="send" class="send">➤</button></div><div id="status" class="status">Միացում…</div><div id="done" class="done"><div class="box"><b>✅ Տվյալները պահպանված են</b><div class="muted" style="margin-top:6px">Հաջորդ քայլը՝ բեռնեք հաստատող փաստաթուղթը։</div><div class="upload"><input id="document" type="file" accept="image/*,.pdf,.jpg,.jpeg,.png,.webp"><button id="uploadBtn" class="primary">Ուղարկել փաստաթուղթը</button><div id="uploadResult" class="muted"></div><button id="cabinetBtn" class="primary hidden" onclick="location.href='master_cabinet.html'">🤝 Բացել գործընկերոջ կաբինետը</button></div></div></div></div></div><script>const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const initData=tg?.initData||'',uid=Number(tg?.initDataUnsafe?.user?.id||0),chat=document.getElementById('chat'),input=document.getElementById('input'),send=document.getElementById('send'),status=document.getElementById('status'),done=document.getElementById('done'),composer=document.getElementById('composer');let busy=false;function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function add(role,text){const d=document.createElement('div');d.className='msg '+role;d.textContent=String(text??'');chat.appendChild(d);chat.scrollTop=chat.scrollHeight}async function jsonResponse(r){const text=await r.text();try{return JSON.parse(text)}catch(e){throw new Error('Сервер вернул не JSON: '+text.slice(0,180))}}async function api(path,body){const r=await fetch(path,{method:'POST',headers:{'X-Telegram-Init-Data':initData,'Content-Type':'application/json'},body:JSON.stringify(body||{})});const d=await jsonResponse(r);if(!r.ok||d.ok===false)throw new Error(d.detail||d.message||d.error||('HTTP '+r.status));return d}async function start(){if(!initData){status.innerHTML='<span class="error">Բացեք այս բաժինը Telegram հավելվածում։</span>';return}try{const d=await api('/api/webapp/partner/start');add('ai',String(d.message||'Պատմեք ձեր բիզնեսի մասին։').replace(/<[^>]*>/g,''));status.textContent='Գրանցումը շարունակվում է';input.focus()}catch(e){status.innerHTML='<span class="error">Չհաջողվեց սկսել․ '+esc(e.message)+'</span>'}}async function sendMessage(){const text=input.value.trim();if(!text||busy)return;busy=true;send.disabled=true;add('user',text);input.value='';status.textContent='AI-ը մտածում է…';try{const d=await api('/api/webapp/partner/message',{text});if(d.message)add('ai',String(d.message).replace(/<[^>]*>/g,''));if(d.completed){composer.classList.add('hidden');done.style.display='block';status.textContent='⏳ Հայտը սպասում է ստուգման'}}catch(e){add('ai','⚠️ '+e.message);status.textContent='Կարող եք շարունակել'}finally{busy=false;send.disabled=false;input.focus()}}send.onclick=sendMessage;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});document.getElementById('uploadBtn').onclick=async()=>{const file=document.getElementById('document').files[0],res=document.getElementById('uploadResult'),btn=document.getElementById('uploadBtn');if(!file){res.innerHTML='<span class="error">Ընտրեք փաստաթուղթ։</span>';return}if(file.size>10*1024*1024){res.innerHTML='<span class="error">Ֆайл слишком большой.</span>';return}btn.disabled=true;try{const fd=new FormData();fd.append('file',file,file.name);fd.append('document_type','business_verification');const r=await fetch('/api/master/'+uid+'/documents/upload',{method:'POST',headers:{'X-Telegram-Init-Data':initData},body:fd});const d=await jsonResponse(r);if(!r.ok||d.ok===false)throw new Error(d.detail||d.message||d.error||('HTTP '+r.status));res.textContent='✅ Փաստաթուղթը ուղարկված է ադմինիստրատորի ստուգմանը';status.textContent='⏳ Սպասում է ստուգման';document.getElementById('cabinetBtn').classList.remove('hidden')}catch(e){res.innerHTML='<span class="error">'+esc(e.message)+'</span>'}finally{btn.disabled=false}};start();</script></body></html>
