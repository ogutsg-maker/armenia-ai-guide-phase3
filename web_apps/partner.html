<!doctype html><html lang="hy"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Partner registration</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{font:16px system-ui;background:#f5f7fb;color:#172033}.wrap{max-width:620px;margin:auto;padding:20px}.card{background:white;border-radius:20px;padding:24px;border:1px solid #e3e7ee}.field{display:block;width:100%;box-sizing:border-box;padding:13px;margin:8px 0;border:1px solid #d8dee8;border-radius:12px}.btn{width:100%;padding:14px;border:0;border-radius:12px;background:#182033;color:white;font-weight:800;margin-top:8px}.err{color:#b42318;margin-top:10px}</style><div class="wrap"><b>🤝 Armenia AI Guide</b><div class="card"><h1>🏢 Գրանցել ձեր բիզնեսը</h1><p>Գրանցումը ավարտվում է այստեղ։ Միայն անունն ու հեռախոսն են պարտադիր։ Ծառայությունները ավելացվում են արդեն կաբինետում։</p><input id="name" class="field" placeholder="Անվանում *"><input id="phone" class="field" placeholder="Հեռախոս *"><button class="btn" onclick="reg()">✓ Գրանցվել</button><div id="e" class="err"></div></div></div><script>const tg=Telegram.WebApp;tg.ready();tg.expand();async function reg(){e.textContent='';try{let r=await fetch('/api/partner/register',{method:'POST',headers:{'Content-Type':'application/json','X-Telegram-Init-Data':tg.initData},body:JSON.stringify({name:name.value,phone:phone.value})});let d=await r.json();if(!r.ok)throw Error(d.error);location.href=d.destination||'/master_cabinet.html'}catch(x){e.textContent=x.message||'registration_failed'}}</script></html>
