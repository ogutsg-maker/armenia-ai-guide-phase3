<!doctype html><html lang="hy"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Armenia AI Guide — Registration</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{font:16px system-ui;background:#f5f7fb;color:#172033}.wrap{max-width:680px;margin:auto;padding:20px}.card{background:#fff;border-radius:20px;padding:24px;border:1px solid #e3e7ee}.input{width:100%;box-sizing:border-box;padding:14px;margin:10px 0;border:1px solid #d8dee8;border-radius:12px;font:inherit}.btn{width:100%;padding:14px;border:0;border-radius:12px;background:#182033;color:#fff;font-weight:800;margin-top:8px}.preview{margin-top:18px;padding:16px;border-radius:14px;background:#f4f6fa}.missing{color:#9a3412}.ok{color:#166534}.muted{color:#667085}</style><div class="wrap"><b>🤝 Armenia AI Guide</b><div class="card"><h1>🏢 Գրանցել բիզնեսը</h1><p>Գրեք սովորական հաղորդագրությամբ, թե ինչ բիզնես եք ուզում գրանցել։ AI-ն կպահի արդեն հայտնի տվյալները և կհարցնի միայն պակասողը։</p><textarea id="text" class="input" rows="6" placeholder="Օրինակ՝ Ուզում եմ գրանցել «Ավտո Մաստեր» ավտոսպասարկումը Հրազդանում..."></textarea><button id="send" class="btn" onclick="send()">🤖 Ուղարկել AI-ին</button><div id="out"></div></div></div><script>const tg=(window.Telegram&&window.Telegram.WebApp)?window.Telegram.WebApp:null;if(tg){tg.ready();tg.expand();}function esc(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function render(r){if(!r)return '';if(r.kind==='registered'){return '<div class="preview"><div class="ok">✓ Գրանցումը հաստատվեց</div><p>Բիզնեսը ստեղծված է։</p></div>'}const d=r.draft||{};let h='<div class="preview"><h3>🤖 AI նախադիտում</h3>';for(const [k,label] of [['name','Անվանում'],['phone','Հեռախոս'],['marz','Մարզ'],['city','Քաղաք'],['village','Գյուղ'],['address','Ճշգրիտ հասցե'],['hours','Աշխատանքային օրեր և ժամեր']]){if(d[k])h+='<p><b>'+label+':</b> '+esc(d[k])+'</p>'}if((r.missing||[]).length){h+='<p class="missing"><b>Մնացել է уточнить:</b> '+r.missing.map(esc).join(', ')+'</p><p>Կարող եք բոլոր տվյալները ուղարկել մեկ հաղորդագրությամբ։</p>'}else{h+='<p class="ok"><b>Տվյալները լրացված են.</b></p><button class="btn" onclick="sendText(\'հաստատում եմ\')">✓ Հաստատում եմ</button>'}h+='</div>';return h}async function sendText(t){document.getElementById('text').value=t;await send()}async function send(){const el=document.getElementById('text'),btn=document.getElementById('send'),out=document.getElementById('out');const text=el.value.trim();if(!text)return;btn.disabled=true;btn.textContent='AI աշխատում է…';try{if(!tg||!tg.initData)throw Error('Բացեք գրանցումը Telegram հավելվածից');const r=await fetch('/api/partner/registration-ai',{method:'POST',headers:{'Content-Type':'application/json','X-Telegram-Init-Data':tg.initData||''},body:JSON.stringify({text})});const d=await r.json();if(!r.ok)throw Error(d.error||'request_failed');out.innerHTML=render(d.result);el.value=''}catch(e){out.innerHTML='<div class="preview missing">'+esc(e.message||'Փորձեք կրկին')+'</div>'}finally{btn.disabled=false;btn.textContent='🤖 Ուղարկել AI-ին'}}</script></html>
