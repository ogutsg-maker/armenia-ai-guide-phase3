<!doctype html>
<html lang="hy">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Armenia AI Guide — Partner</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>:root{--bg:#f4f6fa;--card:#fff;--text:#182033;--muted:#707b8f;--line:#e2e7ef;--accent:#635bdb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:620px;margin:auto;padding:22px 16px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:850;font-size:20px}.sub{margin-top:4px;color:var(--muted);font-size:11px;letter-spacing:.12em}.langs{display:flex;gap:4px}.langs button{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:9px;padding:6px 8px;font-weight:750}.langs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}.card{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 8px 30px #10182812}.hero h1{margin:0 0 10px;font-size:28px}.hero p{margin:0;color:var(--muted);line-height:1.65}.btn{width:100%;margin-top:22px;border:0;border-radius:13px;padding:14px;font-weight:850;font-size:16px;background:var(--accent);color:#fff;cursor:pointer}.note{margin-top:16px;color:var(--muted);font-size:13px;line-height:1.5}.error{display:none;margin-top:14px;padding:11px 13px;border-radius:11px;background:#fdecec;color:#a72f2f}</style>
</head><body><div class="wrap"><div class="top"><div><div class="brand">🤝 Armenia AI Guide</div><div class="sub">PARTNER</div></div><div class="langs"><button data-lang="hy" class="active">AM</button><button data-lang="ru">RU</button><button data-lang="en">EN</button></div></div>
<div class="card"><section class="hero"><h1 id="title">🏢 Գրանցում գործընկերոջ համար</h1><p id="intro"></p></section><button id="open" class="btn"></button><div id="error" class="error"></div><div id="note" class="note"></div></div></div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const dict={
hy:{title:'🏢 Գրանցում գործընկերոջ համար',intro:'Գրանցումը կատարվում է AI օպերատորի միջոցով։ Պատմեք ձեր բիզնեսի մասին ազատ ձևով։ AI-ը մեկ նախադիտմամբ կհավաքի ընկերությունը, ծառայությունները, գները և գտնվելու վայրը։ Հաստատումից հետո հայտը կստեղծվի։ Փաստաթուղթը կարող եք կցել հենց նույն առաջին փուլում՝ առանց երկրորդ հաստատման։',open:'🤖 Բացել AI գրանցումը',note:'Առանձին ձև լրացնել պետք չէ։ Ընկերությունը, ծառայությունները և մնացած աշխատանքային տվյալները կառավարելու եք գործընկերոջ AI կաբինետում։'},
ru:{title:'🏢 Регистрация партнёра',intro:'Регистрация проходит через AI-оператора. Расскажите о бизнесе свободным текстом. AI одним предварительным результатом соберёт компанию, услуги, цены и местоположение. После подтверждения заявка будет создана. Документ можно прикрепить в этом же первом шаге — без второго подтверждения.',open:'🤖 Открыть AI-регистрацию',note:'Отдельную форму заполнять не нужно. Компанией, услугами и остальными рабочими данными вы будете управлять через AI-кабинет партнёра.'},
en:{title:'🏢 Partner registration',intro:'Registration is handled by the AI operator. Describe your business freely. AI will prepare one preview with the company, services, prices and location. After your confirmation the application will be created. You can attach the document in this same first step — no second confirmation.',open:'🤖 Open AI registration',note:'No separate form is required. Manage the company, services and other work data through the partner AI cabinet.'}};
let lang=localStorage.getItem('armenia_ai_guide_lang')||'hy';
function render(){const d=dict[lang]||dict.hy;title.textContent=d.title;intro.textContent=d.intro;open.textContent=d.open;note.textContent=d.note;document.querySelectorAll('[data-lang]').forEach(x=>x.classList.toggle('active',x.dataset.lang===lang))}
document.querySelectorAll('[data-lang]').forEach(x=>x.onclick=()=>{lang=x.dataset.lang;localStorage.setItem('armenia_ai_guide_lang',lang);render()});
async function start(){open.disabled=true;error.style.display='none';try{const initData=tg?.initData||'';if(!initData)throw new Error('telegram_init_data_required');const r=await fetch('/api/webapp/partner/start',{method:'POST',headers:{'Content-Type':'application/json','X-Telegram-Init-Data':initData},body:'{}'});const d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw new Error(d.error||'registration_start_failed');location.replace('/master_cabinet.html?v=20261003-1')}catch(e){error.textContent=e.message||'registration_start_failed';error.style.display='block';open.disabled=false}}
open.onclick=start;render();
</script></body></html>
