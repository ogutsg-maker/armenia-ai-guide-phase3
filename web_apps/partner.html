<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Armenia AI Guide — Partner</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f6f8;color:#202124}.wrap{max-width:720px;margin:0 auto;padding:20px}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 4px 20px #00000012}.messages{min-height:320px;max-height:58vh;overflow:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:14px}.msg{padding:11px 13px;border-radius:14px;white-space:pre-wrap}.ai{background:#f0f2f5;align-self:flex-start}.user{background:#e5f0ff;align-self:flex-end}.row{display:flex;gap:8px}textarea{flex:1;min-height:54px;border:1px solid #ddd;border-radius:12px;padding:10px;resize:vertical}button{border:0;border-radius:12px;padding:11px 15px;cursor:pointer}.send{background:#111;color:#fff}.muted{color:#777;font-size:13px;margin:8px 0}.notice{background:#fff8df;padding:10px;border-radius:12px;margin-bottom:12px}
</style>
</head>
<body><div class="wrap"><div class="card">
<h2>🤝 Armenia AI Guide</h2>
<div id="notice" class="notice">Գրանցումը սկսված է։ Պատմեք ձեր բիզնեսի մասին ազատ ձևով։</div>
<div id="messages" class="messages"></div>
<div class="row"><textarea id="input" placeholder="Օրինակ՝ Հրազդանում ունեմ ավտոլվացման կետ..."></textarea><button id="send" class="send">➤</button></div>
<div id="status" class="muted"></div>
</div></div>
<script>
const tg=window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const headers=()=>({'X-Telegram-Init-Data':tg?.initData||''});
const messages=document.getElementById('messages'),input=document.getElementById('input'),status=document.getElementById('status');
function add(role,text){const d=document.createElement('div');d.className='msg '+role;d.textContent=text||'';messages.appendChild(d);messages.scrollTop=messages.scrollHeight}
async function api(path,opt={}){opt.headers={...headers(),...(opt.headers||{})};if(opt.body&&typeof opt.body!=='string'){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)}const r=await fetch(path,opt);const d=await r.json().catch(()=>({ok:false,error:'bad_json'}));if(!r.ok||d.ok===false)throw new Error(d.error||d.message||('HTTP '+r.status));return d}
async function start(){try{const d=await api('/api/webapp/partner/start',{method:'POST'});if(d.message)add('ai',d.message)}catch(e){status.textContent=e.message}}
async function send(){const text=input.value.trim();if(!text)return;input.value='';add('user',text);status.textContent='…';document.getElementById('send').disabled=true;try{const d=await api('/api/webapp/partner/message',{method:'POST',body:{text}});if(d.message)add('ai',d.message);if(d.completed&&d.application_id){status.textContent='✓ Հայտը պատրաստ է՝ #'+d.application_id+'.';add('ai','Հայտը պատրաստ է։ Ստուգեք տվյալները և ուղարկեք հայտը։');}}catch(e){add('ai','⚠️ '+e.message)}finally{status.textContent='';document.getElementById('send').disabled=false;input.focus()}}
document.getElementById('send').onclick=send;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});start();
</script></body></html>
