<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Armenia AI Guide — Client</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172033;font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:900px;margin:auto;padding:12px}.hero,.panel{background:#fff;border:1px solid #e3e7ee;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 8px 30px #00000008}.logo{font-size:24px;font-weight:900}.muted{color:#687386;font-size:13px}.chat{height:38vh;min-height:300px;overflow:auto;padding:6px}.msg{max-width:84%;padding:11px 13px;border-radius:15px;margin:8px 0;white-space:pre-wrap}.ai{background:#eef2f7}.me{background:#111827;color:#fff;margin-left:auto}.row{display:flex;gap:8px}.row>*{flex:1}.btn{border:0;border-radius:12px;padding:11px 14px;background:#111827;color:#fff;font-weight:800;cursor:pointer}.secondary{background:#e9edf2;color:#172033}.composer{display:flex;gap:8px;margin-top:8px}.composer textarea{flex:1;resize:none;border:1px solid #d8dee8;border-radius:13px;padding:11px;font:inherit}.cards{display:grid;gap:9px;margin-top:10px}.candidate{border:1px solid #e0e5ec;border-radius:14px;padding:13px}.candidate b{display:block;font-size:16px}.candidate button{margin-top:9px}.hidden{display:none!important}.pay{background:#f7f9fc;border:1px solid #e0e5ec;border-radius:14px;padding:14px;margin-top:10px}.success{background:#eaf8ef;border:1px solid #bfe7ca;border-radius:14px;padding:14px;margin-top:10px}.messages2{max-height:300px;overflow:auto;border:1px solid #e3e7ee;border-radius:12px;padding:10px}.status{margin-top:7px;font-size:12px;color:#687386}@media(max-width:600px){.wrap{padding:8px}.chat{height:40vh}.msg{max-width:92%}}</style></head><body><div class="wrap"><div class="hero"><div class="logo">✦ Armenia AI Guide</div><div class="muted">ARMENIA · AI CONCIERGE</div></div><div class="panel"><div class="row"><input id="q" placeholder="Օր.՝ փնտրում եմ վարսավիր Երևանում" style="flex:3;padding:11px;border:1px solid #d8dee8;border-radius:12px"><button class="btn" onclick="search()">Որոնել</button></div><div id="status" class="status"></div><div id="cards" class="cards"></div></div><div class="panel"><h3>AI բանակցություն</h3><div id="negMessages" class="messages2"></div><div class="composer"><textarea id="negText" rows="2" placeholder="Գրեք ձեր ցանկությունը կամ «համաձայն եմ»"></textarea><button class="btn" onclick="sendNegotiation()">Ուղարկել</button></div><div id="payment" class="pay hidden"><b>Պայմանները համաձայնեցված են</b><p class="muted">Սա Test Idram է։ Իրական գումար չի գանձվում։</p><button class="btn" onclick="payTest()">💳 Test Idram → ամրագրել</button></div><div id="result"></div></div></div><script>const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const initData=tg?.initData||'';let requestId=null,negotiationId=null,selected=null,seen=0;function auth(){return {'Content-Type':'application/json','X-Telegram-Init-Data':initData}}async function api(url,opt={}){opt.headers={...auth(),...(opt.headers||{})};const r=await fetch(url,opt);const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||('HTTP '+r.status));return d}function addMsg(text,who='ai'){const e=document.createElement('div');e.className='msg '+(who==='client'?'me':'ai');e.textContent=text;document.getElementById('negMessages').appendChild(e);const b=document.getElementById('negMessages');b.scrollTop=b.scrollHeight}async function search(){const q=document.getElementById('q').value.trim();if(!q)return;try{document.getElementById('status').textContent='Որոնում եմ հաստատված ծառայությունները…';const r=await api('/api/market/client/search',{method:'POST',body:JSON.stringify({query:q})});const cards=document.getElementById('cards');cards.innerHTML='';if(!r.items.length){cards.innerHTML='<div class="muted">Հաստատված համապատասխան ծառայություն դեռ չկա։</div>';return}const req=await api('/api/market/client/request',{method:'POST',body:JSON.stringify({query:q,summary:q})});requestId=req.request.id;r.items.slice(0,3).forEach(x=>{const e=document.createElement('div');e.className='candidate';e.innerHTML='<b>'+esc(x.business_name)+'</b><div>'+esc(x.service_name)+' · '+esc(x.price??'—')+' '+esc(x.currency||'AMD')+'</div><div class="muted">'+esc(x.city||'')+'</div><button class="btn" onclick="selectService('+x.service_id+')">Ընտրել</button>';cards.appendChild(e)});document.getElementById('status').textContent='Ընտրեք մինչև 3 առաջարկներից մեկը։'}catch(e){document.getElementById('status').textContent='Սխալ՝ '+e.message}}function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}async function selectService(id){try{const r=await api('/api/market/client/request/'+requestId+'/select',{method:'POST',body:JSON.stringify({service_id:id})});selected=r.candidate;negotiationId=r.negotiation.id;document.getElementById('negMessages').innerHTML='';addMsg('Ծառայությունը ընտրված է։ Կարող եք գրել ձեր պայմանները։');await refreshNegotiation()}catch(e){addMsg('Սխալ՝ '+e.message)}}async function refreshNegotiation(){if(!negotiationId)return;const r=await api('/api/market/client/negotiation/'+negotiationId);document.getElementById('negMessages').innerHTML='';r.messages.forEach(m=>addMsg(m.message,m.sender_role==='client'?'client':'ai'));if(r.negotiation.status==='agreed')document.getElementById('payment').classList.remove('hidden')}async function sendNegotiation(){if(!negotiationId){addMsg('Սկզբում ընտրեք ծառայություն։');return}const t=document.getElementById('negText').value.trim();if(!t)return;document.getElementById('negText').value='';addMsg(t,'client');const r=await api('/api/market/client/negotiation/'+negotiationId+'/message',{method:'POST',body:JSON.stringify({message:t})});document.getElementById('negMessages').innerHTML='';r.messages.forEach(m=>addMsg(m.message,m.sender_role==='client'?'client':'ai'));if(r.negotiation.status==='agreed')document.getElementById('payment').classList.remove('hidden')}async function payTest(){const r=await api('/api/market/client/negotiation/'+negotiationId+'/pay-test',{method:'POST',body:JSON.stringify({})});document.getElementById('payment').classList.add('hidden');document.getElementById('result').innerHTML='<div class="success"><b>✅ Բրոնավորումը հաստատված է</b><div>№ '+r.booking.id+' · '+r.booking.service_name+' · '+r.booking.agreed_price+' '+r.booking.currency+'</div><div style="margin-top:8px"><b>Գործընկեր՝ '+esc(r.partner.business_name)+'</b><br>'+esc((r.partner.locations||[]).map(x=>[x.marz,x.city,x.village,x.address].filter(Boolean).join(', ')).join(' · '))+'</div><div style="margin-top:8px">QR token: <code>'+esc(r.checkin.token)+'</code></div>'+(r.qr?'<div style="margin-top:8px;text-align:center"><img src="'+r.qr+'" alt="QR" style="width:180px;height:180px;border:1px solid #e0e5ec;border-radius:12px;background:#fff"><div class="muted">Ցույց տվեք այս QR-ը մասնագետին</div></div>':'')+'<div class="muted" style="margin-top:7px">Test Idram transaction: '+esc(r.payment.provider_payment_id)+'</div></div>'}setInterval(()=>{if(negotiationId)refreshNegotiation().catch(()=>{})},4000);</script></body></html>
