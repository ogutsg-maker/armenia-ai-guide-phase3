<!doctype html>
<html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Armenia AI Guide</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{font:15px system-ui;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:800px;margin:auto;padding:14px}
.card,.item{background:#fff;border:1px solid #e1e6ee;border-radius:18px;padding:16px;margin:10px 0}.row{display:flex;gap:8px}
.row input{flex:1;padding:12px;border:1px solid #d8dee8;border-radius:11px}.btn{border:0;border-radius:11px;padding:12px;background:#182033;color:#fff;font-weight:800;cursor:pointer}
.muted{color:#6b7280;font-size:13px;margin-top:5px}.error{color:#b42318}.success{color:#16794b}.wait{padding:10px 0}
.messages{max-height:55vh;overflow:auto}.msg{padding:9px 12px;border-radius:14px;margin:7px 0;background:#eef1f6;max-width:82%}.mine{margin-left:auto;background:#182033;color:#fff}
</style></head><body><div class="wrap"><h2>✦ Armenia AI Guide</h2><div class="nav"><button class="btn" onclick="home()">🔎 Поиск</button><button class="btn" onclick="loadNegotiations()">💬 Переговоры</button><button class="btn" onclick="loadNotifications()">🔔 Уведомления</button></div><div id="app" class="card"></div></div>
<script>
(function(){
const tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.ready();tg.expand()}
const H={'X-Telegram-Init-Data':tg?tg.initData:'','Content-Type':'application/json'};let currentNegotiation=null,pollTimer=null;
async function api(url,options){const r=await fetch(url,Object.assign({},options||{},{headers:Object.assign({},H,(options&&options.headers)||{})}));const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'request_failed');return d}
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function priceLabel(s){return (s.price_type==='from'?'from':'fixed')+' '+(s.price_amd==null?'—':Number(s.price_amd).toLocaleString('en-US',{maximumFractionDigits:2}))+' AMD'}
function home(){clearInterval(pollTimer);app.innerHTML='<div class="card"><form id="searchForm"><div class="row"><input id="searchInput" autocomplete="off" placeholder="Օր.՝ ремонт холодильников"><button class="btn" type="submit">🔎</button></div></form><div id="items"></div></div>';searchForm.addEventListener('submit',e=>{e.preventDefault();search()})}
async function search(){const text=searchInput.value.trim();if(!text){items.innerHTML='<div class="muted">Գրեք, թե ինչ ծառայություն եք փնտրում։</div>';return}items.innerHTML='<div class="wait">Փնտրում եմ հաստատված ծառայություններ…</div>';try{const d=await api('/api/client/search',{method:'POST',body:JSON.stringify({text})}),rows=Array.isArray(d.items)?d.items:[];items.innerHTML=rows.length?rows.map(x=>'<div class="item"><b>'+esc(x.company_name||'Գործընկեր')+'</b><div>'+esc(x.name||'Ծառայություն')+' · '+priceLabel(x)+'</div>'+(x.city||x.territory?'<div class="muted">📍 '+esc(x.city||x.territory)+'</div>':'')+'<div class="muted">Հաստատված ակտիվ ծառայություն</div><button class="btn select-btn" data-service-id="'+Number(x.id)+'" style="margin-top:10px">Ընտրել</button></div>').join(''):'<div class="muted">Հաստատված համապատասխան ծառայություն չգտա։</div>'}catch(e){items.innerHTML='<div class="error">Չհաջողվեց կատարել որոնումը։</div>'}}
async function selectService(id){items.innerHTML='<div class="wait">Հարցումը ստեղծվում է…</div>';try{const d=await api('/api/client/services/'+encodeURIComponent(id)+'/select',{method:'POST',body:'{}'});showNegotiation(d.negotiation_id)}catch(e){items.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
function showNegotiation(id){clearInterval(pollTimer);currentNegotiation=Number(id);app.innerHTML='<h3>💬 Переговоры</h3><div id="neg"></div><div class="row"><input id="messageInput" placeholder="Напишите сообщение…"><button class="btn" id="sendBtn">➤</button></div><button class="btn" style="margin-top:8px" onclick="home()">← Поиск</button>';sendBtn.onclick=sendMessage;messageInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendMessage()}});loadNegotiation();pollTimer=setInterval(loadNegotiation,3000)}
async function loadNegotiation(){try{const d=await api('/api/negotiations/'+currentNegotiation+'?role=client'),n=d.negotiation;let html='<div class="card"><b>'+esc(n.service_name)+'</b><div class="muted">'+esc(n.company_name||'')+(n.city?' · 📍 '+esc(n.city):'')+'</div><div class="muted">Статус: '+esc(n.status)+'</div></div>';if(n.status==='waiting_partner')html+='<div class="wait">⏳ Ожидаем подтверждения интереса партнёра…</div>';if(n.status==='nonresponsive'||n.status==='declined')html+='<div class="error">Партнёр не подтвердил запрос. Поиск продолжается.</div>';if(n.status==='active')html+='<div class="success">✓ Партнёр заинтересован. Можно начинать переговоры.</div><div class="card"><b>Согласовать цену</b><div class="row"><input id="agreePrice" type="number" min="1" placeholder="Цена, AMD"><button class="btn" onclick="agreeTerms()">✓ Согласовать</button></div></div>';if(n.status==='agreed')html+='<div class="success">✓ Условия согласованы: '+esc(n.agreed_price)+' AMD</div><button class="btn" onclick="createBooking()">📅 Создать бронирование</button>';html+='<div class="messages">'+d.messages.map(m=>'<div class="msg '+(m.sender_role===d.role?'mine':'')+'"><b>'+esc(m.sender_role==='client'?'Вы':'Партнёр')+'</b><br>'+esc(m.message)+'</div>').join('')+'</div>';neg.innerHTML=html;messageInput.disabled=n.status!=='active';sendBtn.disabled=n.status!=='active'}catch(e){neg.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function agreeTerms(){const p=Number(agreePrice.value);if(!p)return;try{await api('/api/negotiations/'+currentNegotiation+'/terms',{method:'POST',body:JSON.stringify({agreed_price:p})});await loadNegotiation()}catch(e){alert(e.message)}}
async function createBooking(){try{const d=await api('/api/client/negotiations/'+currentNegotiation+'/booking',{method:'POST',body:JSON.stringify({})});alert('Бронирование создано. Партнёр должен подтвердить. Комиссия к оплате: '+d.booking.commission_amd+' AMD');await loadNegotiation()}catch(e){alert(e.message)}}
async function sendMessage(){const text=messageInput.value.trim();if(!text)return;sendBtn.disabled=true;try{await api('/api/negotiations/'+currentNegotiation+'/messages?role=client',{method:'POST',body:JSON.stringify({message:text})});messageInput.value='';await loadNegotiation()}catch(e){alert(e.message)}finally{sendBtn.disabled=false}}
async function loadNegotiations(){clearInterval(pollTimer);try{const d=await api('/api/client/negotiations'),rows=d.items||[];app.innerHTML='<h3>💬 Переговоры</h3>'+(rows.length?rows.map(x=>'<div class="item"><b>'+esc(x.service_name)+'</b><div class="muted">'+esc(x.company_name||'')+(x.city?' · 📍 '+esc(x.city):'')+'</div><div class="muted">Статус: '+esc(x.status)+'</div><button class="btn" style="margin-top:8px" onclick="showNegotiation('+Number(x.id)+')">💬 Открыть</button></div>').join(''):'<div class="muted">Переговоров пока нет.</div>')}catch(e){app.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function loadNotifications(){clearInterval(pollTimer);try{const d=await api('/api/client/notifications'),rows=d.items||[];app.innerHTML='<h3>🔔 Уведомления</h3>'+(rows.length?rows.map(x=>{const p=x.payload||{};let body;if(x.kind==='partner_interested'){body='<b>💬 Партнёр заинтересован</b><div>'+esc(p.service_name||'Услуга')+'</div><div class="muted">'+esc(p.company_name||'Партнёр')+'</div><button class="btn" style="margin-top:8px" onclick="showNegotiation('+Number(p.negotiation_id)+')">💬 Открыть переговоры</button>'}else if(x.kind==='partner_declined'){body='<b>❌ Партнёр отказался</b><div>'+esc(p.service_name||'Услуга')+'</div>'}else{body='<b>'+esc(x.kind||'Уведомление')+'</b>'}return '<div class="card">'+body+(x.read_at?'':'<button class="btn" style="margin-top:8px" onclick="markNotification('+Number(x.id)+')">Прочитано</button>')+'</div>'}).join(''):'<div class="muted">Уведомлений нет.</div>')}catch(e){app.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function markNotification(id){try{await api('/api/client/notifications/'+id+'/read',{method:'POST',body:'{}'});loadNotifications()}catch(e){app.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
document.addEventListener('click',e=>{const b=e.target.closest('.select-btn');if(b)selectService(b.dataset.serviceId)});home();
})();
</script></body></html>
