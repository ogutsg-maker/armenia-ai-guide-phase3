<!doctype html>
<html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Armenia AI Guide</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}body{font:15px system-ui,-apple-system,sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:800px;margin:auto;padding:12px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.brand{font-weight:800}.nav{display:flex;gap:6px;flex-wrap:wrap}.nav button,.btn{border:0;border-radius:11px;padding:10px 13px;background:#182033;color:#fff;font-weight:750;cursor:pointer}.btn.secondary{background:#e9edf4;color:#172033}.card,.item{background:#fff;border:1px solid #e1e6ee;border-radius:18px;padding:14px;margin:9px 0}.muted{color:#6b7280;font-size:13px}.error{color:#b42318}.success{color:#16794b}.wait{padding:14px;text-align:center;color:#687386}.chat{background:#e7edf4;border:1px solid #dbe2eb;border-radius:18px;overflow:hidden}.chatHead{background:#fff;padding:12px 14px;border-bottom:1px solid #dfe5ed}.chatTitle{font-weight:800}.chatSub{font-size:12px;color:#687386;margin-top:2px}.messages{height:52vh;min-height:300px;overflow:auto;padding:12px;background:linear-gradient(#eef3f7,#e7edf4)}.msg{padding:9px 12px;border-radius:16px;margin:7px 0;background:#fff;max-width:82%;box-shadow:0 1px 1px #d7dde5}.mine{margin-left:auto;background:#d9fdd3}.msgWho{font-size:11px;font-weight:750;color:#687386;margin-bottom:2px}.msgText{white-space:pre-wrap;word-break:break-word}.system{max-width:94%;margin:10px auto;padding:9px 12px;border-radius:12px;background:#fff7d6;border:1px solid #f0df98;text-align:center;font-size:13px}.agreement{margin:10px 12px;padding:12px;border-radius:14px;background:#fff;border:1px solid #d9e0e8}.composer{display:flex;gap:8px;padding:10px;background:#fff;border-top:1px solid #dfe5ed}.composer input{flex:1;padding:12px;border:1px solid #d8dee8;border-radius:14px;outline:none}.actions{padding:0 12px 12px;background:#fff}.actions .btn{width:100%}.row{display:flex;gap:8px}.row input{flex:1;padding:11px;border:1px solid #d8dee8;border-radius:11px}
</style></head><body><div class="wrap">
<div class="top"><div class="brand">✦ Armenia AI Guide</div><div class="nav"><button onclick="home()">🔎</button><button onclick="loadNegotiations()">💬</button><button onclick="loadNotifications()">🔔</button></div></div>
<div id="app"></div></div>
<script>
(function(){
const tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.ready();tg.expand()}
const H={'X-Telegram-Init-Data':tg?tg.initData:'','Content-Type':'application/json'};const app=document.getElementById('app');let currentNegotiation=null,pollTimer=null;
async function api(url,options){const r=await fetch(url,Object.assign({},options||{},{headers:Object.assign({},H,(options&&options.headers)||{})}));const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'request_failed');return d}
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function priceLabel(s){return (s.price_type==='from'?'от':'фикс.')+' '+(s.price_amd==null?'—':Number(s.price_amd).toLocaleString('en-US',{maximumFractionDigits:2}))+' AMD'}
function home(){clearInterval(pollTimer);app.innerHTML='<div class="card"><form id="searchForm"><div class="row"><input id="searchInput" autocomplete="off" placeholder="Օր.՝ ремонт холодильников"><button class="btn" type="submit">🔎</button></div></form><div id="items"></div></div>';document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault();search()})}
async function search(){const text=document.getElementById('searchInput').value.trim();if(!text){document.getElementById('items').innerHTML='<div class="muted">Գրեք, թե ինչ ծառայություն եք փնտրում։</div>';return}items.innerHTML='<div class="wait">Փնտրում եմ հաստատված ծառայություններ…</div>';try{const d=await api('/api/client/search',{method:'POST',body:JSON.stringify({text})}),rows=Array.isArray(d.items)?d.items:[];items.innerHTML=rows.length?rows.map(x=>'<div class="item"><b>'+esc(x.company_name||'Գործընկեր')+'</b><div>'+esc(x.name||'Ծառայություն')+' · '+priceLabel(x)+'</div>'+(x.city||x.territory?'<div class="muted">📍 '+esc(x.city||x.territory)+'</div>':'')+'<div class="muted">Հաստատված актив ծառայություն</div><button class="btn select-btn" data-service-id="'+Number(x.id)+'" style="margin-top:10px">Выбрать</button></div>').join(''):'<div class="muted">Հաստատված համապատասխան ծառայություն չգտա։</div>'}catch(e){items.innerHTML='<div class="error">Չհաջողվեց կատարել որոնումը։</div>'}}
async function selectService(id){items.innerHTML='<div class="wait">Запрос создаётся…</div>';try{const d=await api('/api/client/services/'+encodeURIComponent(id)+'/select',{method:'POST',body:'{}'});showNegotiation(d.negotiation_id)}catch(e){document.getElementById('items').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
function renderMessages(messages,role){return '<div class="messages" id="messages">'+messages.map(m=>'<div class="msg '+(m.sender_role===role?'mine':'')+'"><div class="msgWho">'+esc(m.sender_role===role?'Вы':(m.sender_role==='client'?'Клиент':'Партнёр'))+'</div><div class="msgText">'+esc(m.message)+'</div></div>').join('')+'</div>'}
function showNegotiation(id){clearInterval(pollTimer);currentNegotiation=Number(id);app.innerHTML='<div class="chat"><div id="chatHead" class="chatHead"></div><div id="neg"></div><div class="composer"><input id="messageInput" placeholder="Напишите сообщение…"><button class="btn" id="sendBtn">➤</button></div><div class="actions"><button class="btn secondary" onclick="loadNegotiations()">← Все переговоры</button></div></div>';sendBtn.onclick=sendMessage;document.getElementById('messageInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});loadNegotiation();pollTimer=setInterval(loadNegotiation,3000)}
async function loadNegotiation(){try{const d=await api('/api/negotiations/'+currentNegotiation+'?role=client'),n=d.negotiation;chatHead.innerHTML='<div class="chatTitle">💬 '+esc(n.company_name||'Партнёр')+'</div><div class="chatSub">'+esc(n.service_name||'Услуга')+(n.city?' · 📍 '+esc(n.city):'')+'</div>';let body=renderMessages(d.messages||[],d.role);if(n.status==='waiting_partner')body+='<div class="system">⏳ Запрос отправлен партнёру. Ожидаем его ответа.</div>';if(n.status==='active')body+='<div class="agreement"><b>Переговоры продолжаются</b><div class="muted">Пишите обычными сообщениями. Когда условия согласованы, обе стороны подтверждают цену.</div></div>';if(n.status==='declined'||n.status==='nonresponsive'||n.status==='expired')body+='<div class="system">Диалог завершён. Запрос возвращён в поиск.</div>';if(n.status==='agreed'){body+='<div class="system">✓ Условия согласованы обеими сторонами.</div><div class="agreement"><b>Согласованные условия</b><div>Цена: <b>'+esc(n.agreed_price)+' AMD</b></div><div class="muted">Теперь можно оформить бронирование.</div></div>';try{const bd=await api('/api/negotiations/'+currentNegotiation+'/booking');if(bd.booking)body+='<div class="agreement"><b>📅 Бронирование создано</b><div class="muted">Статус: '+esc(bd.booking.status)+'</div></div>';else body+='<div class="actions"><button class="btn" onclick="createBooking()">📅 Оформить бронирование</button></div>'}catch(_){body+='<div class="actions"><button class="btn" onclick="createBooking()">📅 Оформить бронирование</button></div>'}}else if(n.status==='active'){body+='<div class="agreement"><b>Подтвердить цену</b><div class="muted">Укажите цену, с которой вы согласны. Партнёр должен подтвердить её со своей стороны.</div><div class="row" style="margin-top:8px"><input id="agreePrice" type="number" min="1" placeholder="Цена, AMD"><button class="btn" onclick="agreeTerms()">✓</button></div></div>'}neg.innerHTML=body;messageInput.disabled=n.status!=='active';sendBtn.disabled=n.status!=='active';const box=document.getElementById('messages');if(box)box.scrollTop=box.scrollHeight}catch(e){neg.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function agreeTerms(){const p=Number(document.getElementById('agreePrice')?.value);if(!p)return;try{await api('/api/negotiations/'+currentNegotiation+'/terms',{method:'POST',body:JSON.stringify({agreed_price:p})});await loadNegotiation()}catch(e){alert(e.message)}}
async function createBooking(){try{const d=await api('/api/client/negotiations/'+currentNegotiation+'/booking',{method:'POST',body:JSON.stringify({})});alert('Бронирование создано. Статус: '+d.booking.status);await loadNegotiation()}catch(e){alert(e.message)}}
async function sendMessage(){const text=document.getElementById('messageInput').value.trim();if(!text)return;document.getElementById('sendBtn').disabled=true;try{await api('/api/negotiations/'+currentNegotiation+'/messages?role=client',{method:'POST',body:JSON.stringify({message:text})});document.getElementById('messageInput').value='';await loadNegotiation()}catch(e){alert(e.message)}finally{document.getElementById('sendBtn').disabled=false}}
async function loadNegotiations(){clearInterval(pollTimer);try{const d=await api('/api/client/negotiations'),rows=d.items||[];app.innerHTML='<h3>💬 Переговоры</h3>'+(rows.length?rows.map(x=>'<div class="item" onclick="showNegotiation('+Number(x.id)+')" style="cursor:pointer"><b>'+esc(x.company_name||'Партнёр')+'</b><div>'+esc(x.service_name||'Услуга')+'</div><div class="muted">'+(x.city?'📍 '+esc(x.city)+' · ':'')+esc(x.status)+'</div><button class="btn" style="margin-top:8px">💬 Открыть чат</button></div>').join(''):'<div class="muted">Переговоров пока нет.</div>')}catch(e){app.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function loadNotifications(){clearInterval(pollTimer);try{const d=await api('/api/client/notifications'),rows=d.items||[];app.innerHTML='<h3>🔔 Уведомления</h3>'+(rows.length?rows.map(x=>{const p=x.payload||{};let body;if(x.kind==='partner_interested')body='<b>💬 Партнёр заинтересован</b><div>'+esc(p.service_name||'Услуга')+'</div><div class="muted">'+esc(p.company_name||'Партнёр')+'</div><button class="btn" style="margin-top:8px" onclick="showNegotiation('+Number(p.negotiation_id)+')">💬 Открыть чат</button>';else if(x.kind==='partner_declined')body='<b>❌ Партнёр отказался</b><div>'+esc(p.service_name||'Услуга')+'</div>';else body='<b>'+esc(x.kind||'Уведомление')+'</b>';return '<div class="card">'+body+(x.read_at?'':'<button class="btn secondary" style="margin-top:8px" onclick="markNotification('+Number(x.id)+')">Прочитано</button>')+'</div>'}).join(''):'<div class="muted">Уведомлений нет.</div>')}catch(e){app.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function markNotification(id){try{await api('/api/client/notifications/'+id+'/read',{method:'POST',body:'{}'});loadNotifications()}catch(e){app.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
document.addEventListener('click',e=>{const b=e.target.closest('.select-btn');if(b)selectService(b.dataset.serviceId)});Object.assign(window,{home,search,selectService,showNegotiation,loadNegotiation,agreeTerms,createBooking,sendMessage,loadNegotiations,loadNotifications,markNotification});home();
})();
</script></body></html>
