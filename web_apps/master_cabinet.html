const T={
hy:{ai:'AI Օգնական',company:'Ընկերություն',object:'Հասցե',selectObject:'Ընտրեք հասցեն',objectName:'Հասցեի անվանում',marz:'Մարզ',autoFromObject:'կընտրվի հասցեից',optionalNew:'կամ նոր հեռախոս',objectDataRequired:'Լրացրեք օբյեկտի անվանումը, հասցեն և քաղաքը',businesses:'Իմ ընկերությունները',applications:'Հայտեր',notifications:'Ծանուցումներ',orders:'Պատվերներ',negotiations:'Բանակցություններ',settings:'Կարգավորումներ',objects:'Հասցեներ',directions:'Ուղղություններ',services:'Ծառայություններ',territories:'Տարածքներ',documents:'Փաստաթղթեր',companyInfo:'Ընկերության տվյալներ',companySettings:'Ընկերության կարգավորումներ',objectEdit:'Խմբագրել հասցեն',serviceEdit:'Խմբագրել ծառայությունը',companySettingsHint:'Տվյալ ընկերության տվյալների խմբագրում',saved:'Պահպանված',open:'Բացել',back:'← Հետ',pending:'Սպասում է',approved:'Հաստատված',active:'Ակտիվ',rejected:'Մերժված',newCompany:'＋ Նոր ընկերություն',empty:'Տվյալներ դեռ չկան',save:'Պահպանել',addObject:'＋ Հասցե',addService:'＋ Նոր ծառայություն',all:'Բոլորը',applicationInfo:'Հայտի ընթացք',noOrders:'Պատվերներ դեռ չկան',noNegotiations:'Բանակցություններ դեռ չկան',global:'Ընդհանուր կարգավորումներ',name:'Անվանում',description:'Նկարագրություն',phoneCompany:'Հեռախոս',city:'Քաղաք',address:'Հասցե',phone:'Հեռախոս',status:'Կարգավիճակ',classification:'AI դասակարգում',document:'Փաստաթուղթ',price:'Գին',},

en:{ai:'AI Assistant',company:'Company',object:'Address',selectObject:'Select an address',objectName:'Address name',marz:'Marz',autoFromObject:'taken from address',optionalNew:'or new phone',objectDataRequired:'Fill object name, address and city',businesses:'My companies',applications:'Applications',notifications:'Notifications',orders:'Orders',negotiations:'Negotiations',settings:'Settings',objects:'Addresses',directions:'Directions',services:'Services',territories:'Territories',documents:'Documents',companyInfo:'Company information',companySettings:'Company settings',objectEdit:'Edit address',serviceEdit:'Edit service',companySettingsHint:'Edit this company',saved:'Saved',open:'Open',back:'← Back',pending:'Pending',approved:'Approved',active:'Active',rejected:'Rejected',newCompany:'＋ New company',empty:'No data yet',save:'Save',addObject:'＋ Address',addService:'＋ New service',all:'All',applicationInfo:'Application progress',noOrders:'No orders yet',noNegotiations:'No negotiations yet',global:'General settings',name:'Name',description:'Description',phoneCompany:'Phone',city:'City',address:'Address',phone:'Phone',status:'Status',classification:'AI classification',document:'Document',price:'Price',}
};
const tr=k=>(T[state.lang]||T.hy)[k]||k;
function headers(){return {'X-Telegram-Init-Data':tg?.initData||''};}
async function api(path,opt={}){opt.headers={...headers(),...(opt.headers||{})};if(opt.body&&typeof opt.body!=='string'){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)}const r=await fetch(path,opt);const d=await r.json().catch(()=>({ok:false,error:'bad_json'}));if(!r.ok||d.ok===false)throw new Error(d.error||d.message||('HTTP '+r.status));return d}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function status(s){s=String(s||'').toLowerCase();let cls=s==='approved'||s==='active'?'ok':s==='rejected'?'bad':'warn';let label={approved:tr('approved'),active:tr('active'),pending:tr('pending'),pending_admin:tr('pending'),pending_partner:tr('pending'),document_pending:tr('pending'),document_under_review:tr('pending'),needs_clarification:tr('pending'),draft:tr('pending'),rejected:tr('rejected')}[s]||s;return '<span class="chip '+cls+'">'+esc(label)+'</span>'}
function toast(x){const e=document.getElementById('toast');e.textContent=x;e.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.style.display='none',2600)}
function setView(id, push=true){document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));document.getElementById(id)?.classList.add('on');document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===id));if(push)state.stack.push(id)}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>openMain(b.dataset.view));
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{state.lang=b.dataset.lang;document.documentElement.lang=state.lang;applyLang();renderAll()});
function applyLang(){document.querySelectorAll('[data-i]').forEach(e=>e.textContent=tr(e.dataset.i));document.querySelectorAll('[data-lang]').forEach(e=>e.classList.toggle('active',e.dataset.lang===state.lang));}
document.getElementById('businessSelect').onchange=e=>{state.current=state.businesses.find(x=>String(x.id)===e.target.value)||state.businesses[0]||null;if(state.current)openBusiness(state.current.id)};async function refreshCabinet(){const btn=document.getElementById('refreshBtn');if(btn)btn.disabled=true;try{await loadBusinesses();if(state.current){await loadBusinessData();renderBusinesses();await openBusiness(state.current.id)}else renderBusinesses();if(document.getElementById('notifications')?.classList.contains('on')){await loadNotifications();renderNotifications()}toast('✓ '+(state.lang==='hy'?'Թարմացվեց':state.lang==='ru'?'Обновлено':'Refreshed'))}catch(e){toast(e.message)}finally{if(btn)btn.disabled=false}}document.getElementById('refreshBtn').onclick=refreshCabinet;
async function loadBusinesses(){const d=await api('/api/master/current/businesses');state.businesses=d.businesses||d.companies||[];state.current=state.current&&state.businesses.find(x=>String(x.id)===String(state.current.id))||state.businesses[0]||null;const s=document.getElementById('businessSelect');s.innerHTML=state.businesses.map(b=>'<option value="'+b.id+'">'+esc(b.name)+'</option>').join('');if(state.current)s.value=state.current.id;}
async function loadBusinessData(){if(!state.current)return;const h={'X-Business-Id':String(state.current.id)};const safe=async(path,empty)=>{try{return await api(path,{headers:h})}catch(e){console.warn(path,e);return empty}};const [o,s,docs]=await Promise.all([
safe('/api/master/current/objects',{objects:[]}),safe('/api/master/current/services',{services:[]}),safe('/api/master/current/documents',{documents:[]})]);
state.objects=o.objects||[];state.services=s.services||[];state.documents=docs.docs||docs.documents||[];try{state.locations=(await api('/api/master/current/locations',{headers:h})).locations||[]}catch(e){state.locations=[]}try{state.reviews=(await api('/api/master/current/reviews',{headers:h})).reviews||[]}catch(e){state.reviews=[]}}
async function loadApplications(){const h=state.current?{'X-Business-Id':String(state.current.id)}:{};const d=await api('/api/master/current/applications',{headers:h});state.applications=d.applications||[]}
function applicationRows(){const bid=state.current?.id;const all=state.applications||[];if(!bid)return all;const scoped=all.filter(a=>a.business_id!=null&&String(a.business_id)===String(bid));return scoped.length||all.some(a=>a.business_id!=null)?scoped:all}
async function openMain(id){try{if(id==='ai'){renderAi();setView('ai')}if(id==='businesses'){renderBusinesses();setView('businesses')}if(id==='applications'){await loadApplications();renderApplications();setView('applications')}if(id==='notifications'){await loadNotifications();renderNotifications();setView('notifications')}if(id==='orders'){const d=await api('/api/master/current/bookings');state.bookings=d.bookings||[];renderOrders();setView('orders')}if(id==='negotiations'){await loadNegotiations();setView('negotiations')}if(id==='settings'){const d=await api('/api/master/current/settings');state.settings=d.settings||{};renderSettings();setView('settings')}}catch(e){toast(e.message)}}
function renderAi(){const e=document.getElementById('ai');e.innerHTML='<div class="heading"><div><h1>🤖 '+tr('ai')+'</h1><p>'+({hy:'Ձեր աջ ձեռքը՝ կառավարելու ամբողջ աշխատանքային տարածքը։',ru:'Ваш правый помощник — управляйте кабинетом обычным разговором.',en:'Your right hand — manage the whole cabinet by simply talking.'}[state.lang]||'')+'</p></div></div><div class="detail ai-chat"><div id="aiMessages" class="ai-messages"><div class="ai-msg ai">'+({hy:'Բարև 👋 Ասեք կամ գրեք, ինչ եք ուզում անել։ Ես կփորձեմ հասկանալ և ցույց կտամ գործողությունը հաստատելուց առաջ։',ru:'Здравствуйте 👋 Скажите или напишите, что хотите сделать. Я пойму задачу и покажу действие перед изменением данных.',en:'Hello 👋 Tell me or write what you want to do. I will understand the task and show the action before changing data.'}[state.lang]||'')+'</div></div><div class="ai-compose"><button class="ai-mic" onclick="startAiVoice()">🎤</button><textarea id="aiInput" placeholder="'+({hy:'Գրեք ձեր խնդրանքը...',ru:'Напишите, что хотите сделать...',en:'Tell me what you want to do...'}[state.lang]||'')+'"></textarea><button class="ai-attach" type="button" onclick="document.getElementById(&quot;aiDocumentInput&quot;)?.click()" title="'+({hy:'Կցել փաստաթուղթ',ru:'Прикрепить документ',en:'Attach document'}[state.lang]||'Attach document')+'">📎</button><input id="aiDocumentInput" type="file" accept=".pdf,image/jpeg,image/png,image/webp" style="display:none" onchange="uploadAiDocument(this)"><button class="ai-send" onclick="sendAiCommand()">➤</button></div><div id="aiDocumentStatus" class="muted small" style="margin-top:7px"></div><div id="aiPreview" class="ai-preview"></div></div>';const t=document.getElementById('aiInput');t?.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendAiCommand()}})}
function aiAdd(role,text){const e=document.getElementById('aiMessages');if(!e)return;const d=document.createElement('div');d.className='ai-msg '+role;d.textContent=text;e.appendChild(d);e.scrollTop=e.scrollHeight}
async function uploadAiDocument(input){
  const file=input?.files?.[0];
  if(!file)return;
  const status=document.getElementById('aiDocumentStatus');
  const allowed=['application/pdf','image/jpeg','image/png','image/webp'];
  if(!allowed.includes(file.type)){
    toast(state.lang==='hy'?'Թույլատրվում են PDF, JPG, PNG կամ WEBP ֆայլեր։':state.lang==='ru'?'Разрешены только PDF, JPG, PNG կամ WEBP.':'Only PDF, JPG, PNG or WEBP files are allowed.');
    input.value='';
    return;
  }
  if(file.size>10*1024*1024){
    toast(state.lang==='hy'?'Ֆայլը չպետք է գերազանցի 10 ՄԲ-ը։':state.lang==='ru'?'Файл не должен превышать 10 МБ.':'File must not exceed 10 MB.');
    input.value='';
    return;
  }
  try{
    if(status)status.textContent=state.lang==='hy'?'📎 Փաստաթուղթը բեռնվում է…':state.lang==='ru'?'📎 Документը բեռնվում է…':'📎 Uploading document…';
    const fd=new FormData();
    fd.append('file',file);
    fd.append('document_type','business_document');
    const headersObj={...headers()};
    if(state.current?.id)headersObj['X-Business-Id']=String(state.current.id);
    const r=await fetch('/api/master/current/ai-command/document',{method:'POST',headers:headersObj,body:fd});
    const d=await r.json().catch(()=>({ok:false,error:'bad_json'}));
    if(!r.ok||d.ok===false)throw new Error(d.error||d.message||('HTTP '+r.status));
    if(status)status.textContent=(state.lang==='hy'?'📎 Կցված է՝ ':state.lang==='ru'?'📎 Прикреплён: ':'📎 Attached: ')+(d.filename||file.name);
    aiAdd('user',state.lang==='hy'?'📎 Փաստաթուղթը կցեցի։':state.lang==='ru'?'📎 Документ прикреплён.':'📎 Document attached.');

    // If the application was already submitted, never send another AI turn.
    // If upload completed the collecting phase, one AI turn may build the final
    // confirmation preview. The server has already persisted the document.
    if(String(d.pending_status||'').toUpperCase()==='SUBMITTED'){
      const p=document.getElementById('aiPreview');
      if(p)p.innerHTML='';
      await loadApplications().catch(()=>{});
      if(typeof renderApplications==='function')renderApplications();
      return;
    }

    if(d.pending_ready_for_confirmation){
      const p=document.getElementById('aiPreview');
      if(p)p.innerHTML='<div class="notice">🤖 …</div>';
      const command=await api('/api/master/current/ai-command',{method:'POST',body:{
        message:state.lang==='hy'?'Փաստաթուղթը կցված է։':state.lang==='ru'?'Документ прикреплён.':'Document attached.',
        language:state.lang,
        business_id:state.current?.id||null
      }});
      if(p)p.innerHTML=aiCommandHtml(command);
      if(command.reply)aiAdd('ai',command.reply);
    } else {
      const p=document.getElementById('aiPreview');
      if(p)p.innerHTML='';
    }
  }catch(e){
    if(status)status.textContent='';
    toast(e.message||'document_upload_failed');
  }finally{
    input.value='';
  }
}

function cleanCompanyDescription(value){
  const raw=String(value||'').trim();
  if(!raw)return '';
  if(raw.length<220)return raw;
  const m=raw.match(/Մենք\s+մատուցում\s+ենք\s+(.+?)\s+ծառայություններ\.?/i);
  if(m)return 'Մատուցում ենք '+m[1].trim()+' ծառայություններ։';
  const ru=raw.match(/Мы\s+предоставляем\s+(.+?)(?:услуги|услуг)\.?/i);
  if(ru)return 'Предоставляем '+ru[1].trim()+' услуги.';
  const en=raw.match(/We\s+(?:provide|offer)\s+(.+?)(?:services)\.?/i);
  if(en)return 'We provide '+en[1].trim()+' services.';
  return raw.length>240?raw.slice(0,237)+'…':raw;
}

function analyzeServiceText(){
  const input=document.getElementById('svcAiText');
  const text=String(input?.value||'').trim();
  const statusEl=document.getElementById('svcAiStatus');
  const preview=document.getElementById('svcAiPreview');
  if(!text){toast('Напишите или расскажите об услуге');return;}
  // Extract the explicit price locally; catalogue classification remains on the server.
  const priceMatches=[...text.matchAll(/(?:^|\s)(\d{3,7})(?:[.,]\d+)?\s*(?:դրամ|դր\.?|֏|amd|dram|драм)\b/giu)];
  const price=priceMatches.length?Number(priceMatches[priceMatches.length-1][1]):null;
  let name=text;
  if(priceMatches.length){
    const p=priceMatches[0].index;
    name=text.slice(0,p).replace(/^(?:добавьте|добавить|добавим|ավելացրեք|ավելացնել|add)\s+/iu,'').trim();
  }
  name=name.replace(/^(?:услугу|услуга|ծառայություն|service)\s*[:,-]?\s*/iu,'').trim();
  // Keep a compact phrase as the service name; the original speech/text is preserved as description.
  if(name.length>100) name=name.slice(0,100).trim();
  document.getElementById('svcName').value=name;
  document.getElementById('svcDescription').value=text;
  if(price!==null) document.getElementById('svcPrice').value=price;
  const company=document.getElementById('svcBusiness')?.selectedOptions?.[0]?.textContent||'';
  const address=document.getElementById('svcObject')?.selectedOptions?.[0]?.textContent||'';
  preview.style.display='block';
  preview.innerHTML='<b>Проверьте данные</b><br>🏢 '+esc(company)+'<br>📍 '+esc(address||'—')+'<br>🛠 '+esc(name||'—')+'<br>💰 '+esc(price===null?'Цена не указана':price+' ֏');
  statusEl.textContent='✓ Данные подготовлены. После «Сохранить» AI классифицирует услугу.';
}
let serviceRecognition=null;
function startServiceVoice(){
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  const btn=document.getElementById('svcVoiceBtn');
  const statusEl=document.getElementById('svcAiStatus');
  if(!SpeechRecognition){
    toast('Голосовой ввод не поддерживается этим браузером. Можно написать текст.');
    return;
  }
  if(serviceRecognition){try{serviceRecognition.stop()}catch(e){} serviceRecognition=null;return;}
  const r=new SpeechRecognition();
  r.lang=state.lang==='hy'?'hy-AM':state.lang==='ru'?'ru-RU':'en-US';
  r.continuous=false;r.interimResults=true;
  r.onstart=()=>{btn.textContent='⏹ Остановить';statusEl.textContent='🎤 Слушаю…'};
  r.onresult=(e)=>{
    let text='';
    for(let i=e.resultIndex;i<e.results.length;i++) text+=e.results[i][0].transcript;
    document.getElementById('svcAiText').value=text;
  };
  r.onerror=()=>{statusEl.textContent='Не удалось распознать голос. Попробуйте ещё раз или напишите текст.';btn.textContent='🎤 Говорить';serviceRecognition=null};
  r.onend=()=>{btn.textContent='🎤 Говорить';serviceRecognition=null; if(document.getElementById('svcAiText')?.value.trim()) analyzeServiceText();};
  serviceRecognition=r;
  r.start();
}
async function uploadApplicationDocument(applicationId,file){
  if(!applicationId||!file)return;
  const fd=new FormData();
  fd.append('file',file);
  fd.append('document_type','business_document');
  const r=await fetch('/api/master/current/applications/'+applicationId+'/document',{method:'POST',headers:headers(),body:fd});
  const d=await r.json().catch(()=>({ok:false,error:'bad_json'}));
  if(!r.ok||d.ok===false)throw new Error(d.error||d.message||('HTTP '+r.status));
  return d;
}
async function submitNewService(){
  const businessValue=document.getElementById('svcBusiness')?.value||'';
  const newBusiness=businessValue==='__new__';
  const objectValue=document.getElementById('svcObject')?.value||'';
  const newObject=objectValue==='__new__';
  const serviceName=document.getElementById('svcName')?.value.trim()||'';
  const description=document.getElementById('svcDescription')?.value.trim()||'';
  const priceRaw=document.getElementById('svcPrice')?.value.trim()||'';
  const phone=document.getElementById('svcPhone')?.value.trim()||'';
  const businessDocument=document.getElementById('svcBusinessDocument')?.files?.[0]||null;
  if(!businessValue){toast('Выберите компанию');return}
  if(newBusiness && (document.getElementById('svcBusinessName')?.value.trim()||'').length<2){toast('Введите название компании');return}
  if(!newBusiness && !state.businesses.find(b=>String(b.id)===String(businessValue))){toast('Компания не найдена');return}
  if(!objectValue){toast('Выберите адрес или создайте новый');return}
  if(newObject){
    if((document.getElementById('svcObjectName')?.value.trim()||'').length<2){toast('Введите название адреса');return}
    if(!(document.getElementById('svcObjectAddress')?.value.trim()||'')){toast('Введите адрес');return}
    if(!(document.getElementById('svcObjectCity')?.value.trim()||'')){toast('Введите город');return}
  }
  if(serviceName.length<2){toast('Введите название услуги');return}
  if(priceRaw!==''&&(!Number.isFinite(Number(priceRaw))||Number(priceRaw)<0)){toast('Проверьте цену');return}
  const save=document.querySelector('#serviceCreateModal .actions .btn:not(.secondary)');
  if(save){save.disabled=true;save.textContent='Сохранение…'}
  try{
    let businessId;
    let objectId;
    if(newBusiness){
      const b=await api('/api/master/current/businesses',{method:'POST',body:{
        name:document.getElementById('svcBusinessName').value.trim(),
        description:document.getElementById('svcBusinessDescription').value.trim(),
        phone:document.getElementById('svcBusinessPhone').value.trim()
      }});
      businessId=b.business.id;
      await loadBusinesses();
    }else businessId=Number(businessValue);

    if(newObject){
      const o=await api('/api/master/current/objects',{method:'POST',headers:{'X-Business-Id':String(businessId)},body:{
        name:document.getElementById('svcObjectName').value.trim(),
        address:document.getElementById('svcObjectAddress').value.trim(),
        city:document.getElementById('svcObjectCity').value.trim(),
        marz:document.getElementById('svcObjectMarz').value.trim(),
        phone:document.getElementById('svcObjectPhone').value.trim() || null
      }});
      objectId=o.object.id;
    }else{
      objectId=Number(objectValue);
    }

    const company=state.businesses.find(b=>String(b.id)===String(businessId))||null;
    const contactPhone=phone || company?.phone || '';
    const d=await api('/api/master/current/services',{method:'POST',headers:{'X-Business-Id':String(businessId)},body:{
      name:serviceName,description,price:priceRaw===''?null:Number(priceRaw),
      object_id:objectId,contact_phone:contactPhone,new_business:newBusiness
    }});
    if(newBusiness && businessDocument && d.application_id){
      await uploadApplicationDocument(d.application_id,businessDocument);
    }
    closeServiceCreate();
    await loadBusinesses();
    state.current=state.businesses.find(b=>String(b.id)===String(businessId))||state.businesses[0]||null;

    // A successful POST can mean two different things:
    // 1) an active service was created, or
    // 2) the service was accepted and turned into an admin application.
    // Do not reopen the Services section in case (2): the service is not
    // active yet and therefore will correctly be absent from /services.
    if(d.proposal_created){
      await loadApplications();
      renderApplications();
      setView('applications', false);
      const appId=d.application_id ? ' #'+d.application_id : '';
      toast(
        newBusiness&&businessDocument
          ? '✓ Заявка'+appId+' отправлена администратору вместе с документом'
          : '✓ Заявка'+appId+' отправлена администратору на проверку'
      );
    }else{
      await openBusiness(businessId);
      showCompanySection('services');
      toast('✓ '+(d.message||'Услуга сохранена'));
    }
  }catch(e){
    if(save){save.disabled=false;save.textContent='✓ '+tr('save')}
    toast(e.message);
  }
}

async function replyNegotiation(id){const el=document.getElementById('partnerNegText');const message=(el.value||'').trim();if(!message)return;try{const btn=el.parentElement?.querySelector('button');if(btn)btn.disabled=true;await api('/api/master/current/negotiations/'+id+'/message',{method:'POST',body:{message}});await openNegotiation(id)}catch(e){toast(e.message)}finally{if(el)el.value=''}}
async function agreeNegotiation(id){try{await api('/api/master/current/negotiations/'+id+'/agree',{method:'POST',body:{}});await openNegotiation(id)}catch(e){toast(e.message)}}
function renderNegotiations(){document.getElementById('negotiations').innerHTML='<div class="heading"><div><h1>💬 '+tr('negotiations')+'</h1><p>Բանակցությունները առանձին աշխատանքային հոսք են։</p></div><div class="actions"><button class="btn secondary" onclick="openMain(\'businesses\')">← '+tr('businesses')+'</button><button class="btn secondary" onclick="loadNegotiations()">↻</button></div></div><div class="list">'+(state.negotiations?.length?state.negotiations.map(n=>'<div class="item" onclick="openNegotiation('+n.id+')" style="cursor:pointer"><div class="row"><b>#'+n.id+' · '+esc(n.service_name||'')+'</b>'+status(n.status)+'</div><div class="muted">'+esc(n.client_name||'Հաճախորդ')+' · '+esc(n.business_name||'')+'</div></div>').join(''):'<div class="empty">'+tr('noNegotiations')+'</div>')+'</div>'}
function renderSettings(){const s=state.settings||{};const share=s.contact_sharing_enabled!==false;const premium=s.premium_contact_sharing_enabled!==false;document.getElementById('settings').innerHTML='<div class="heading"><div><h1>⚙️ '+tr('settings')+'</h1><p>'+tr('global')+'</p></div></div><div class="detail"><div class="field"><label>Լեզու / Language</label><select onchange="changeLang(this.value)"><option value="hy" '+(state.lang==='hy'?'selected':'')+'>Հայերեն</option><option value="ru" '+(state.lang==='ru'?'selected':'')+'>Русский</option><option value="en" '+(state.lang==='en'?'selected':'')+'>English</option></select></div><div class="section"><h3>📞 Контакты</h3><div class="field"><label>Разрешать передачу контактов клиенту</label><select onchange="saveGeneralSetting(&quot;contact_sharing_enabled&quot;,this.value===&#39;true&#39;)"><option value="true" '+(share?'selected':'')+'>Да</option><option value="false" '+(!share?'selected':'')+'>Нет</option></select></div><div class="field"><label>Premium: передача контактов</label><select onchange="saveGeneralSetting(&quot;premium_contact_sharing_enabled&quot;,this.value===&#39;true&#39;)"><option value="true" '+(premium?'selected':'')+'>Да</option><option value="false" '+(!premium?'selected':'')+'>Нет</option></select></div></div><div class="section"><div class="notice">Общие настройки партнёра действуют для аккаунта. Настройки фирмы, объекта и услуги находятся внутри соответствующей комнаты.</div></div></div>'}
async function saveGeneralSetting(key,value){try{await api('/api/master/current/settings',{method:'POST',body:{[key]:value}});if(!state.settings)state.settings={};state.settings[key]=value;toast('✓ '+tr('saved'))}catch(e){toast(e.message)}}
async function changeLang(v){state.lang=v;applyLang();await saveGeneralSetting('lang',v);renderAll()}
/* Initial */
async function renderAll(){
  applyLang();
  // Paint the cabinet shell immediately. Network/API failures must never leave
  // the Mini App with an empty white main area.
  const root=document.getElementById('businesses');
  if(root)root.innerHTML='<div class="detail"><div class="notice">⏳ '+(state.lang==='hy'?'Բեռնում…':state.lang==='ru'?'Загрузка…':'Loading…')+'</div></div>';
  try{
    await loadBusinesses();
    if(state.current) await loadBusinessData();
    renderBusinesses();
    if(state.current) document.getElementById('businessSelect').value=state.current.id;
    setView('businesses',false);
  }catch(e){
    console.error('partner cabinet init failed',e);
    if(root)root.innerHTML='<div class="detail"><div class="notice">⚠️ '+esc(e.message||'Չհաջողվեց բեռնել կաբինետը')+'</div><button class="btn" onclick="refreshCabinet()">↻ '+(state.lang==='hy'?'Կրկին փորձել':state.lang==='ru'?'Повторить':'Retry')+'</button></div>';
    setView('businesses',false);
  }
}
renderAll();
</script>
</body>
</html>
