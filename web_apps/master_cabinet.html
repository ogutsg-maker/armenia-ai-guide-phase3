<style>.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:18px;z-index:9999}.modal-card{width:min(680px,100%);max-height:90vh;overflow:auto;background:var(--card,#17191f);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35)}.modal-card textarea{min-height:110px;resize:vertical}
:root{--bg:#f4f6fa;--card:#fff;--text:#182033;--muted:#707b8f;--line:#e2e7ef;--accent:#635bdb;--ok:#16834b;--warn:#a36a00;--danger:#c13d3d;--dark:#121826}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:var(--dark);color:#fff;padding:12px 16px}.topin{max-width:1180px;margin:auto;display:flex;align-items:center;gap:12px;justify-content:space-between}.brand{font-weight:850;font-size:17px}.sub{font-size:11px;color:#aeb6c5;margin-top:2px}.tools{display:flex;align-items:center;gap:7px}.tools select,.tools button{background:#fff1;border:1px solid #ffffff2d;color:#fff;border-radius:9px;padding:7px 9px}.tools .active{background:#fff;color:#111827}
.shell{max-width:1180px;margin:auto;display:grid;grid-template-columns:215px 1fr;min-height:calc(100vh - 62px)}
nav{background:#fff;border-right:1px solid var(--line);padding:12px;position:sticky;top:62px;height:calc(100vh - 62px)}nav button{width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:10px;color:#566176;font-weight:750;margin:2px 0}nav button.active,nav button:hover{background:#eeeafd;color:var(--accent)}
main{padding:20px;min-width:0}.view{display:none}.view.on{display:block}.back{border:0;background:none;color:var(--accent);font-weight:800;padding:0;margin-bottom:12px}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.heading h1{font-size:23px;margin:0}.heading p{margin:4px 0 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:0 1px 2px #10182808}.click{cursor:pointer}.click:hover{border-color:#c9c3ff;transform:translateY(-1px)}.name{font-weight:850;font-size:16px}.muted{color:var(--muted)}.small{font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stack>*+*{margin-top:9px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chip{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;background:#f0f2f7;color:#596477;font-size:12px}.ok{background:#e7f6ee;color:var(--ok)}.warn{background:#fff4df;color:var(--warn)}.bad{background:#fdecec;color:var(--danger)}.accent{background:#eeeafd;color:#554bc8}.metric{font-size:26px;font-weight:900;margin-top:5px}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed #cfd5df;border-radius:14px;background:#fff}.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:800;background:var(--accent);color:#fff}.btn.secondary{background:#eef0f5;color:#30394b}.btn.danger{background:#fde9e9;color:var(--danger)}.btn.smallbtn{padding:7px 9px;font-size:12px}
.list{display:grid;gap:10px}.item{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px}.item.click:hover{border-color:#c9c3ff}.detail{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.detail h2{margin:0 0 5px}.section{margin-top:16px}.section h3{font-size:14px;margin:0 0 9px}.actions{display:flex;gap:7px;flex-wrap:wrap}.field{display:grid;gap:5px;margin-top:10px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff;color:var(--text)}.field textarea{min-height:90px;resize:vertical}.notice{padding:12px;border-radius:12px;background:#f5f1ff;color:#4d43a8}.hr{height:1px;background:var(--line);margin:16px 0}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:10px;z-index:100;display:none;max-width:90%}
@media(max-width:850px){.shell{display:block}nav{position:sticky;top:62px;height:auto;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:7px;gap:5px;z-index:15}nav button{white-space:nowrap;width:auto;margin:0;padding:9px 11px}main{padding:14px}.grid{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.tools select{max-width:130px}}
@media(max-width:560px){.grid{grid-template-columns:1fr}.heading h1{font-size:20px}.topin{align-items:flex-start}.sub{display:none}.tools select{max-width:105px}}

<body>
<header class="top"><div class="topin"><div><div class="brand">🤝 Armenia AI Guide</div><div class="sub">Գործընկերոջ աշխատանքային տարածք</div></div><div class="tools"><select id="businessSelect"></select><div id="langs"><button data-lang="hy">AM</button><button data-lang="ru">RU</button><button data-lang="en">EN</button></div></div></div></header>
<div class="shell">

<section id="business" class="view"></section>
<section id="direction" class="view"></section>
<section id="service" class="view"></section>
<section id="application" class="view"></section>

<section id="orders" class="view"></section>

</main></div>
<div id="toast" class="toast"></div>
<script>
const tg=window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const state={lang:(tg?.initDataUnsafe?.user?.language_code||'hy').startsWith('ru')?'ru':'hy',businesses:[],current:null,directions:[],services:[],objects:[],documents:[],applications:[],bookings:[],reviews:[],stack:[]};
const T={
hy:{company:'Ընկերություն',object:'Հասցե',selectObject:'Ընտրեք հասցեն',objectName:'Հասցեի անվանում',marz:'Մարզ',autoFromObject:'կընտրվի հասցեից',optionalNew:'կամ նոր հեռախոս',objectDataRequired:'Լրացրեք օբյեկտի անվանումը, հասցեն և քաղաքը',businesses:'Իմ ընկերությունները',applications:'Հայտեր',orders:'Պատվերներ',negotiations:'Բանակցություններ',settings:'Կարգավորումներ',objects:'Հասցեներ',directions:'Ուղղություններ',services:'Ծառայություններ',territories:'Տարածքներ',documents:'Փաստաթղթեր',companyInfo:'Ընկերության տվյալներ',companySettings:'Ընկերության կարգավորումներ',objectEdit:'Խմբագրել հասցեն',serviceEdit:'Խմբագրել ծառայությունը',companySettingsHint:'Տվյալ ընկերության տվյալների խմբագրում',saved:'Պահպանված',open:'Բացել',back:'← Հետ',pending:'Սպասում է',approved:'Հաստատված',active:'Ակտիվ',rejected:'Մերժված',newCompany:'＋ Նոր ընկերություն',empty:'Տվյալներ դեռ չկան',save:'Պահպանել',addObject:'＋ Հասցե',addService:'＋ Նոր ծառայություն',all:'Բոլորը',applicationInfo:'Հայտի ընթացք',noOrders:'Պատվերներ դեռ չկան',noNegotiations:'Բանակցություններ դեռ չկան',global:'Ընդհանուր կարգավորումներ',name:'Անվանում',description:'Նկարագրություն',phoneCompany:'Հեռախոս',city:'Քաղաք',address:'Հասցե',phone:'Հեռախոս',status:'Կարգավիճակ',classification:'AI դասակարգում',document:'Փաստաթուղթ',price:'Գին',direction:'Ուղղություն',subcategory:'Ենթաուղղություն'},
ru:{company:'Компания',object:'Адрес',selectObject:'Выберите адрес',objectName:'Название адреса',marz:'Марз',autoFromObject:'подтянется из адреса',optionalNew:'или новый телефон',objectDataRequired:'Заполните название объекта, адрес и город',businesses:'Мои компании',applications:'Заявки',orders:'Заказы',negotiations:'Переговоры',settings:'Настройки',objects:'Адреса',directions:'Направления',services:'Услуги',territories:'Территории',documents:'Документы',companyInfo:'Данные компании',companySettings:'Настройки компании',objectEdit:'Редактировать адрес',serviceEdit:'Редактировать услугу',companySettingsHint:'Редактирование данных этой компании',saved:'Сохранено',open:'Открыть',back:'← Назад',pending:'На проверке',approved:'Подтверждено',active:'Активно',rejected:'Отклонено',newCompany:'＋ Новая компания',empty:'Данных пока нет',save:'Сохранить',addObject:'＋ Адрес',addService:'＋ Новая услуга',all:'Все',applicationInfo:'Ход заявки',noOrders:'Заказов пока нет',noNegotiations:'Переговоров пока нет',global:'Общие настройки',name:'Название',description:'Описание',phoneCompany:'Телефон',city:'Город',address:'Адрес',phone:'Телефон',status:'Статус',classification:'AI-классификация',document:'Документ',price:'Цена',direction:'Направление',subcategory:'Подкатегория'},
en:{company:'Company',object:'Address',selectObject:'Select an address',objectName:'Address name',marz:'Marz',autoFromObject:'taken from address',optionalNew:'or new phone',objectDataRequired:'Fill object name, address and city',businesses:'My companies',applications:'Applications',orders:'Orders',negotiations:'Negotiations',settings:'Settings',objects:'Addresses',directions:'Directions',services:'Services',territories:'Territories',documents:'Documents',companyInfo:'Company information',companySettings:'Company settings',objectEdit:'Edit address',serviceEdit:'Edit service',companySettingsHint:'Edit this company',saved:'Saved',open:'Open',back:'← Back',pending:'Pending',approved:'Approved',active:'Active',rejected:'Rejected',newCompany:'＋ New company',empty:'No data yet',save:'Save',addObject:'＋ Address',addService:'＋ New service',all:'All',applicationInfo:'Application progress',noOrders:'No orders yet',noNegotiations:'No negotiations yet',global:'General settings',name:'Name',description:'Description',phoneCompany:'Phone',city:'City',address:'Address',phone:'Phone',status:'Status',classification:'AI classification',document:'Document',price:'Price',direction:'Direction',subcategory:'Subcategory'}
};
const tr=k=>(T[state.lang]||T.hy)[k]||k;
function headers(){return {'X-Telegram-Init-Data':tg?.initData||''};}
async function api(path,opt={}){opt.headers={...headers(),...(opt.headers||{})};if(opt.body&&typeof opt.body!=='string'){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)}const r=await fetch(path,opt);const d=await r.json().catch(()=>({ok:false,error:'bad_json'}));if(!r.ok||d.ok===false)throw new Error(d.error||d.message||('HTTP '+r.status));return d}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function status(s){s=String(s||'').toLowerCase();let cls=s==='approved'||s==='active'?'ok':s==='rejected'?'bad':'warn';let label={approved:tr('approved'),active:tr('active'),pending:tr('pending'),pending_admin:tr('pending'),pending_partner:tr('pending'),document_pending:tr('pending'),document_under_review:tr('pending'),needs_clarification:tr('pending'),draft:tr('pending'),rejected:tr('rejected')}[s]||s;return '<span class="chip '+cls+'">'+esc(label)+'</span>'}
function toast(x){const e=document.getElementById('toast');e.textContent=x;e.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.style.display='none',2600)}
function setView(id, push=true){document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));document.getElementById(id)?.classList.add('on');document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===id));if(push)state.stack.push(id)}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>openMain(b.dataset.view));
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{state.lang=b.dataset.lang;document.documentElement.lang=state.lang;applyLang();renderAll()});
function applyLang(){document.querySelectorAll('[data-i]').forEach(e=>e.textContent=tr(e.dataset.i));document.querySelectorAll('[data-lang]').forEach(e=>e.classList.toggle('active',e.dataset.lang===state.lang));}
document.getElementById('businessSelect').onchange=e=>{state.current=state.businesses.find(x=>String(x.id)===e.target.value)||state.businesses[0]||null;if(state.current)openBusiness(state.current.id)};
async function loadBusinesses(){const d=await api('/api/master/0/businesses');state.businesses=d.businesses||[];state.current=d.current||state.businesses[0]||null;const s=document.getElementById('businessSelect');s.innerHTML=state.businesses.map(b=>'<option value="'+b.id+'">'+esc(b.name)+'</option>').join('');if(state.current)s.value=state.current.id;}
async function loadBusinessData(){if(!state.current)return;const h={'X-Business-Id':String(state.current.id)};const safe=async(path,empty)=>{try{return await api(path,{headers:h})}catch(e){console.warn(path,e);return empty}};const [o,dg,s,docs]=await Promise.all([
safe('/api/master/0/objects',{objects:[]}),safe('/api/master/0/partner-directions',{directions:[]}),safe('/api/master/0/services',{services:[]}),safe('/api/master/0/documents',{documents:[]})]);
state.objects=o.objects||[];state.directions=dg.directions||[];state.services=s.services||[];state.documents=docs.docs||docs.documents||[];}
async function loadApplications(){const d=await api('/api/master/0/applications');state.applications=d.applications||[]}
async function openMain(id){try{if(id==='businesses'){renderBusinesses();setView('businesses')}if(id==='applications'){await loadApplications();renderApplications();setView('applications')}if(id==='orders'){const d=await api('/api/master/0/bookings');state.bookings=d.bookings||[];renderOrders();setView('orders')}if(id==='negotiations'){renderNegotiations();setView('negotiations')}if(id==='settings'){const d=await api('/api/master/0/settings');state.settings=d.settings||{};renderSettings();setView('settings')}}catch(e){toast(e.message)}}
function renderBusinesses(){document.getElementById('businesses').innerHTML='<div class="heading"><div><h1>'+tr('businesses')+'</h1><p>Յուրաքանչյուր ընկերություն ունի իր առանձին աշխատանքային սենյակը։</p></div><button class="btn" onclick="createBusiness()">'+tr('newCompany')+'</button></div><div class="grid">'+(state.businesses.length?state.businesses.map(b=>'<div class="card click" onclick="openBusiness('+b.id+')"><div class="row"><div class="name">🏢 '+esc(b.name)+'</div>'+status(b.status)+'</div><p class="muted">'+esc(b.description||'')+'</p><div class="actions"><button class="btn smallbtn" onclick="event.stopPropagation();openBusiness('+b.id+')">'+tr('open')+' →</button><button class="btn danger smallbtn" onclick="event.stopPropagation();deleteBusiness('+b.id+')">🗑 '+(state.lang==='hy'?'Ջնջել':state.lang==='ru'?'Удалить':'Delete')+'</button></div></div>').join(''):'<div class="empty">'+tr('empty')+'</div>')+'</div>'}
async function createBusiness(){const name=prompt(tr('name'));if(!name)return;try{await api('/api/master/0/businesses',{method:'POST',body:{name}});await loadBusinesses();renderBusinesses();toast('✓')}catch(e){toast(e.message)}}
async function deleteBusiness(id){const b=state.businesses.find(x=>String(x.id)===String(id));if(!b)return;const label=b.name||'';const msg=state.lang==='hy'?'Ջնջե՞լ ընկերությունը՝ '+label+'։\nՀին պատվերների պատմությունը չի ջնջվի։':state.lang==='ru'?'Удалить компанию «'+label+'»?\nИстория старых заказов не будет удалена.':'Delete company “'+label+'”?\nOld order history will not be deleted.';if(!confirm(msg))return;try{await api('/api/master/0/businesses/'+id,{method:'DELETE'});state.current=null;await loadBusinesses();renderBusinesses();setView('businesses',false);toast('✓')}catch(e){toast(e.message)}}
async function openBusiness(id){state.current=state.businesses.find(x=>String(x.id)===String(id))||state.current;document.getElementById('businessSelect').value=state.current?.id||'';try{await loadBusinessData();renderBusiness();setView('business',false)}catch(e){toast(e.message)}}
function renderBusiness(){const b=state.current||{};document.getElementById('business').innerHTML='<button class="back" onclick="openMain(\'businesses\')">'+tr('back')+'</button><div class="heading"><div><h1>🏢 '+esc(b.name)+'</h1><p>'+esc(b.description||'')+'</p></div><button class="btn secondary" onclick="editCompany()">✎ '+tr('companySettings')+'</button></div><div class="grid"><div class="card click" onclick="showCompanySection(\'objects\')"><div class="name">📍 '+tr('objects')+'</div><div class="metric">'+state.objects.length+'</div><div class="muted">Այս ընկերության հասցեները</div></div><div class="card click" onclick="showCompanySection(\'services\')"><div class="name">🛠 '+tr('services')+'</div><div class="metric">'+state.services.length+'</div><div class="muted">Այս ընկերության ծառայությունները</div></div><div class="card click" onclick="showCompanySection(\'documents\')"><div class="name">📄 '+tr('documents')+'</div><div class="metric">'+state.documents.length+'</div><div class="muted">Ընկերության փաստաթղթեր</div></div><div class="card click" onclick="editCompany()"><div class="name">⚙️ '+tr('companySettings')+'</div><div class="muted">Տվյալ ընկերության տվյալների խմբագրում</div></div></div><div id="companySection" class="section"></div>';showCompanySection('overview')}
function showCompanySection(kind){const e=document.getElementById('companySection');if(!e)return;if(kind==='settings'){e.innerHTML="<div class='detail'><div class='heading'><div><h2>⚙️ "+tr('companySettings')+"</h2><p>"+tr('companySettingsHint')+"</p></div><button class='btn' onclick='editCompany()'>✎ "+tr('save')+"</button></div><div class='grid2'><div><b>"+tr('name')+"</b><div class='muted'>"+esc(state.current?.name||'—')+"</div></div><div><b>"+tr('status')+"</b><div>"+status(state.current?.status)+"</div></div><div><b>"+tr('description')+"</b><div class='muted'>"+esc(state.current?.description||'—')+"</div></div><div><b>"+tr('phoneCompany')+"</b><div class='muted'>"+esc(state.current?.phone||'—')+"</div></div></div><div class='notice'>Здесь изменяются только данные этой фирмы. Общие настройки партнёра находятся в разделе «Общие настройки».</div></div>";return}if(kind==='overview'){e.innerHTML='<div class="detail"><h2>'+tr('companyInfo')+'</h2><div class="grid2"><div><b>'+tr('name')+'</b><div class="muted">'+esc(state.current?.name)+'</div></div><div><b>'+tr('status')+'</b><div>'+status(state.current?.status)+'</div></div><div><b>'+tr('description')+'</b><div class="muted">'+esc(state.current?.description||'—')+'</div></div></div></div>';return}

function serviceLocation(s){

  const address=s?.object_address||o.address||d?.object_snapshot?.address;
  const city=s?.object_city||o.city||d?.object_snapshot?.city;
  const marz=s?.object_marz||o.marz||d?.object_snapshot?.marz;
  const phone=s?.service_contact_phone||d?.contact_phone||o.phone||d?.object_snapshot?.phone;
  const place=[name,[marz,city,address].filter(Boolean).join(', ')].filter(Boolean).join(' · ');

function objectHours(o){
  let canonical=o?.working_hours;
  if(typeof canonical==='string'){try{canonical=JSON.parse(canonical)}catch(e){canonical={}}}
  if(canonical&&typeof canonical==='object'&&Object.keys(canonical).length)return canonical;
  let d=o?.data_json;
  if(typeof d==='string'){try{d=JSON.parse(d)}catch(e){d={}}}
  const h=d?.working_hours;
  return h&&typeof h==='object'?h:{};
}

    '<div class="field"><label>🏢 '+tr('company')+'</label><div style="display:flex;gap:7px"><select id="newServiceBusiness" style="flex:1">'+firms+'</select><button class="btn secondary" onclick="createBusinessFromService()">＋</button></div></div>'+
    '<div class="field"><label>📍 '+tr('object')+'</label><div style="display:flex;gap:7px"><select id="newServiceObject" style="flex:1"><option value="">'+tr('selectObject')+'</option>'+objects+'</select><button class="btn secondary" onclick="createAddressFromService()">＋</button></div></div>'+
    '<div id="newServiceNoAddress" class="notice" style="display:'+(objects?'none':'block')+'">Адресов пока нет. Нажмите «＋», чтобы добавить адрес этой компании.</div>'+
    '<div class="field"><label>🛠 '+tr('name')+'</label><input id="newServiceName" autocomplete="off"></div>'+
    '<div class="field"><label>'+tr('description')+'</label><textarea id="newServiceDescription" rows="4"></textarea></div>'+
    '<div class="field"><label>💰 '+tr('price')+'</label><input id="newServicePrice" type="number" min="0" step="1" inputmode="numeric"></div>'+
    '<div class="notice">AI-ը ինքն է ընտրում գործող կատալոգի դասակարգումը։ Կատալոգի ուղղությունը և ենթակատեգորիան գործընկերը այստեղ չի լրացնում։</div>'+
    '<div class="actions"><button class="btn secondary" onclick="closeServiceCreate()">'+tr('back')+'</button><button class="btn" onclick="submitNewService()">✓ '+tr('save')+'</button></div>'+
  '</div>';
  document.body.appendChild(modal);
  document.getElementById('newServiceObject')?.addEventListener('change',syncServiceObject);
  document.getElementById('newServiceBusiness')?.addEventListener('change',async e=>{
    const id=e.target.value;
    if(!id)return;
    state.current=state.businesses.find(x=>String(x.id)===String(id))||state.current;
    try{
      state.objects=await loadBusinessObjects(id);
      addService();
    }catch(err){toast(err.message)}
  });
  syncServiceObject();
  document.getElementById('newServiceName')?.focus();
}
function syncServiceObject(){
  const id=document.getElementById('newServiceObject')?.value;
  const o=state.objects.find(x=>String(x.id)===String(id));
  const addr=document.getElementById('newServiceAddress');
  const cm=document.getElementById('newServiceCityMarz');
  const ph=document.getElementById('newServicePhone');
  if(o){
    if(addr)addr.value=o.address||'';
    if(cm)cm.value=[o.city,o.marz].filter(Boolean).join(' · ');
    if(ph&&!ph.value)ph.value=o.phone||state.current?.phone||'';
  }else{
    if(addr)addr.value='';
    if(cm)cm.value='';
    if(ph&&!ph.value)ph.value=state.current?.phone||'';
  }
}
async function createAddressFromService(){
  const businessId=document.getElementById('newServiceBusiness')?.value||state.current?.id;
  if(!businessId)return;
  const name=prompt(tr('objectName'));
  if(!name)return;
  const address=prompt(tr('address'));
  if(!address)return;
  const city=prompt(tr('city'));
  if(!city)return;
  const marz=prompt(tr('marz'));
  try{
    const od=await api('/api/master/0/objects',{method:'POST',headers:{'X-Business-Id':String(businessId)},body:{name,address,city,marz,phone:state.current?.phone||''}});
    state.objects=await loadBusinessObjects(businessId);
    addService();
    const sel=document.getElementById('newServiceObject');
    if(sel&&od.object?.id){sel.value=String(od.object.id);syncServiceObject();}
    toast('✓ '+tr('saved'));
  }catch(e){toast(e.message)}
}
async function createBusinessFromService(){
  const name=prompt(tr('name')); if(!name)return;
  try{
    const created=await api('/api/master/0/businesses',{method:'POST',body:{name}});
    await loadBusinesses();
    const createdId=created.business?.id||created.id||state.businesses.filter(b=>String(b.name||'').trim()===name.trim()).sort((a,b)=>Number(b.id)-Number(a.id))[0]?.id;
    if(!createdId)throw new Error('company_create_failed');
    state.current=state.businesses.find(x=>String(x.id)===String(createdId))||state.current;
    state.objects=await loadBusinessObjects(createdId);
    addService();
    const bs=document.getElementById('newServiceBusiness');
    if(bs)bs.value=String(createdId);
  }catch(e){toast(e.message)}
}
async function submitNewService(){
  const businessId=document.getElementById('newServiceBusiness')?.value||state.current?.id;
  const objectId=document.getElementById('newServiceObject')?.value||'';
  const name=document.getElementById('newServiceName')?.value.trim()||'';
  const description=document.getElementById('newServiceDescription')?.value.trim()||'';
  const priceRaw=document.getElementById('newServicePrice')?.value.trim()||'';
  if(!businessId){toast(tr('company'));return}
  if(name.length<2){toast(tr('name'));return}
  if(priceRaw!==''&&(!Number.isFinite(Number(priceRaw))||Number(priceRaw)<0)){toast(tr('price'));return}
  if(!objectId){toast(tr('selectObject'));return}
  try{
    state.current=state.businesses.find(x=>String(x.id)===String(businessId))||state.current;
    const d=await api('/api/master/0/services',{method:'POST',headers:{'X-Business-Id':String(businessId)},body:{name,description,price:priceRaw===''?null:Number(priceRaw),object_id:Number(objectId),contact_phone:state.current?.phone||null}});
    closeServiceCreate();
    await loadBusinesses();
    state.current=state.businesses.find(x=>String(x.id)===String(businessId))||state.current;
    await openBusiness(businessId);
    showCompanySection('services');
    toast(d.proposal_created?'Հայտը ուղարկվեց ադմինիստրատորին':'Ծառայությունը ուղարկվեց ադմինիստրատորին հաստատման համար');
  }catch(e){toast(e.message)}
}
function renderApplications(){document.getElementById('applications').innerHTML='<div class="heading"><div><h1>📨 '+tr('applications')+'</h1><p>Այստեղ միայն ընթացակարգերն են։ Ավարտված հայտը այլևս այստեղ չի մնում որպես ակտիվ գործընթաց։</p></div></div><div class="list">'+(state.applications.length?state.applications.map(a=>'<div class="item click" onclick="openApplication('+a.id+')"><div class="row"><b>#'+a.id+' · '+esc(a.service_name||a.business_name||'Հայտ')+'</b>'+status(a.status)+'</div><div class="muted">'+esc(a.business_name_db||a.business_name||'')+' · '+esc(a.direction_name||a.master_name_am||'')+'</div><div class="chips"><span class="chip">'+esc(a.category_name_am||a.category_name_ru||'AI')+'</span>'+(a.document_id?'<span class="chip ok">📄 '+tr('document')+'</span>':'')+'</div></div>').join(''):'<div class="empty">'+tr('empty')+'</div>')+'</div>'}
function openApplication(id){const a=state.applications.find(x=>x.id===id);if(!a)return;const p=a.payload_json||{};const sv=a.services||p.services||[];document.getElementById('application').innerHTML='<button class="back" onclick="openMain(\'applications\')">'+tr('back')+'</button><div class="detail"><div class="heading"><div><h1>📨 #'+a.id+'</h1><p>'+esc(a.business_name_db||a.business_name||'')+'</p></div>'+status(a.status)+'</div><div class="section"><h3>'+tr('applicationInfo')+'</h3><div class="grid2"><div><b>'+tr('direction')+'</b><div>'+esc(a.master_name_am||a.master_name_ru||a.direction_name||'—')+'</div></div><div><b>'+tr('subcategory')+'</b><div>'+esc(a.category_name_am||a.category_name_ru||a.subcategory_name||'—')+'</div></div><div><b>'+tr('price')+'</b><div>'+esc(a.price??'—')+'</div></div><div><b>'+tr('document')+'</b><div>'+ (a.document_id?status(a.document_status||'pending'):'—')+'</div></div></div></div><div class="section"><h3>'+tr('services')+'</h3><div class="list">'+(sv.length?sv.map(x=>'<div class="item"><div class="row"><b>'+esc(x.name||x.service_name)+'</b><span>'+esc(x.price??'')+' AMD</span></div><div class="muted">'+esc(x.direction_name||'')+' · '+esc(x.subcategory_name||'')+'</div></div>').join(''):'<div class="empty">'+tr('empty')+'</div>')+'</div></div><div class="section"><div class="notice">Եթե գործընթացը ավարտվի հաստատմամբ, արդյունքը դառնում է իրական ընկերություն / ուղղություն / ծառայություն և այլևս չի խառնվում ակտիվ հայտերի հետ։</div></div></div>';setView('application',false)}
function renderOrders(){document.getElementById('orders').innerHTML='<div class="heading"><div><h1>📥 '+tr('orders')+'</h1><p>Պատվերները առանձին աշխատանքային հոսք են և կապված են ընտրված ընկերության հետ։</p></div></div><div class="list">'+(state.bookings.length?state.bookings.map(b=>'<div class="item"><div class="row"><b>#'+b.id+'</b>'+status(b.status)+'</div><div class="muted">'+esc(b.service_name||'')+'</div></div>').join(''):'<div class="empty">'+tr('noOrders')+'</div>')+'</div>'}
function renderNegotiations(){document.getElementById('negotiations').innerHTML='<div class="heading"><div><h1>💬 '+tr('negotiations')+'</h1><p>Բանակցությունները բացվում են առանձին սենյակում՝ առանց ընկերության հիմնական տվյալները խառնելու։</p></div></div><div class="empty">'+tr('noNegotiations')+'</div>'}
function renderSettings(){const s=state.settings||{};const share=s.contact_sharing_enabled!==false;const premium=s.premium_contact_sharing_enabled!==false;document.getElementById('settings').innerHTML='<div class="heading"><div><h1>⚙️ '+tr('settings')+'</h1><p>'+tr('global')+'</p></div></div><div class="detail"><div class="field"><label>Լեզու / Language</label><select onchange="changeLang(this.value)"><option value="hy" '+(state.lang==='hy'?'selected':'')+'>Հայերեն</option><option value="ru" '+(state.lang==='ru'?'selected':'')+'>Русский</option><option value="en" '+(state.lang==='en'?'selected':'')+'>English</option></select></div><div class="section"><h3>📞 Контакты</h3><div class="field"><label>Разрешать передачу контактов клиенту</label><select onchange="saveGeneralSetting(&quot;contact_sharing_enabled&quot;,this.value===&#39;true&#39;)"><option value="true" '+(share?'selected':'')+'>Да</option><option value="false" '+(!share?'selected':'')+'>Нет</option></select></div><div class="field"><label>Premium: передача контактов</label><select onchange="saveGeneralSetting(&quot;premium_contact_sharing_enabled&quot;,this.value===&#39;true&#39;)"><option value="true" '+(premium?'selected':'')+'>Да</option><option value="false" '+(!premium?'selected':'')+'>Нет</option></select></div></div><div class="section"><div class="notice">Общие настройки партнёра действуют для аккаунта. Настройки фирмы, объекта и услуги находятся внутри соответствующей комнаты.</div></div></div>'}
async function saveGeneralSetting(key,value){try{await api('/api/master/0/settings',{method:'POST',body:{[key]:value}});if(!state.settings)state.settings={};state.settings[key]=value;toast('✓ '+tr('saved'))}catch(e){toast(e.message)}}
async function changeLang(v){state.lang=v;applyLang();await saveGeneralSetting('lang',v);renderAll()}
/* Initial */
async function renderAll(){applyLang();try{await loadBusinesses();renderBusinesses();if(state.current)document.getElementById('businessSelect').value=state.current.id}catch(e){toast(e.message)}}
renderAll();
</script>
