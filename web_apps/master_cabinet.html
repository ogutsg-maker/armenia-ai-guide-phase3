<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Armenia AI Guide — Partner Cabinet</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#687386;--line:#e5e9f0;--accent:#6d5dfc;--ok:#16834b;--warn:#a56a00;--danger:#c43d3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;background:#111827;color:#fff;padding:14px 16px}.topin{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:18px;font-weight:800}.sub{font-size:11px;color:#aeb7c7;margin-top:3px}.langs{display:flex;gap:4px}.langs button{border:0;background:#ffffff18;color:#fff;border-radius:8px;padding:6px 8px}.langs .on{background:#fff;color:#111827}.layout{max-width:1200px;margin:auto;display:grid;grid-template-columns:215px 1fr;min-height:calc(100vh - 67px)}nav{background:#fff;border-right:1px solid var(--line);padding:10px;position:sticky;top:67px;height:calc(100vh - 67px)}nav button{display:block;width:100%;border:0;background:transparent;text-align:left;color:#536074;padding:11px;border-radius:10px;margin:2px 0;font-weight:700}nav button.active,nav button:hover{background:#eeeaff;color:var(--accent)}main{padding:20px;min-width:0}.view{display:none}.view.on{display:block}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}.metric{font-size:12px;color:var(--muted)}.metric b{display:block;color:var(--text);font-size:26px;margin-top:4px}.title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}.title h2{margin:0}.muted{color:var(--muted)}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#edf0f5;color:#596579;font-size:11px;font-weight:700}.approved{background:#e7f7ef;color:var(--ok)}.pending{background:#fff3da;color:var(--warn)}.rejected{background:#fdeaea;color:var(--danger)}.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.item{border:1px solid var(--line);border-radius:12px;padding:13px;margin:8px 0;background:#fff}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.primary,.secondary,.danger{border:0;border-radius:9px;padding:9px 13px;font-weight:750}.primary{background:var(--accent);color:#fff}.secondary{background:#edf0f5;color:#334155}.danger{background:#fdeaea;color:var(--danger)}input,textarea{width:100%;border:1px solid #d9dee8;border-radius:10px;padding:10px;margin:5px 0 10px;background:#fff}textarea{min-height:90px}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed #d8dee8;border-radius:12px}.notice{padding:12px 14px;border-radius:12px;background:#f0efff;color:#4d43a4;margin-bottom:13px}.hidden{display:none!important}.table{overflow:auto}.table table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-size:13px}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:16px;z-index:50}.modalbox{background:#fff;border-radius:18px;padding:18px;width:min(520px,100%);max-height:90vh;overflow:auto}@media(max-width:800px){.layout{display:block}nav{height:auto;position:sticky;top:67px;z-index:10;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}nav button{width:auto;min-width:max-content}.grid{grid-template-columns:1fr 1fr}main{padding:12px}}@media(max-width:500px){.grid{grid-template-columns:1fr}.topin{align-items:flex-start}.brand{font-size:16px}}
</style></head>
<body>
<header class="top"><div class="topin"><div><div class="brand">🤝 Armenia AI Guide</div><div class="sub" id="partnerName">Գործընկերոջ սենյակ</div></div><div class="langs"><button id="hy" onclick="setLang('hy')">AM</button><button id="ru" onclick="setLang('ru')">RU</button><button id="en" onclick="setLang('en')">EN</button></div></div></header>
<div class="layout"><nav>
<button class="active" data-view="dashboard">📊 <span data-t="dashboard">Գլխավոր</span></button>
<button data-view="directions">🧭 <span data-t="directions">Ուղղություններ</span></button>
<button data-view="services">🛠 <span data-t="services">Ծառայություններ</span></button>
<button data-view="objects">🏢 <span data-t="objects">Օբյեկտներ</span></button>
<button data-view="orders">📥 <span data-t="orders">Պատվերներ</span></button><button type="button" onclick="location.href='partner_negotiations.html'">💬 Բանակցություններ</button>
<button data-view="locations">📍 <span data-t="locations">Տարածքներ</span></button>
<button data-view="reviews">⭐ <span data-t="reviews">Վարկանիշ</span></button>
<button data-view="documents">📄 <span data-t="documents">Փաստաթղթեր</span></button>
<button data-view="settings">⚙️ <span data-t="settings">Կարգավորումներ</span></button>
</nav><main>
<section id="dashboard" class="view on"><div class="title"><h2>📊 Գործընկերոջ սենյակ</h2><button class="secondary" onclick="loadAll()">↻</button></div><div id="dashboardNotice"></div><div class="grid" id="metrics"></div><div class="card" id="profileCard"></div></section>
<section id="directions" class="view"><div class="title"><h2>🧭 Ուղղություններ</h2></div><div class="notice">Յուրաքանչյուր ուղղություն անցնում է առանձին ստուգում։ Նոր ուղղությունը ավելացվում է AI-ի միջոցով, ոչ թե երկար ձևով։</div><div id="directionList"></div></section>
<section id="services" class="view"><div class="title"><h2>🛠 Ծառայություններ</h2><button class="primary" onclick="openService()">+ Ավելացնել</button></div><div id="serviceList"></div></section>
<section id="objects" class="view"><div class="title"><h2>🏢 Օբյեկտներ</h2><button class="primary" onclick="openObject()">+ Ավելացնել</button></div><div id="objectList"></div></section>
<section id="orders" class="view"><div class="title"><h2>📥 Պատվերներ</h2></div><div id="orderList"></div></section>
<section id="locations" class="view"><div class="title"><h2>📍 Տարածքներ</h2></div><div id="locationList"></div></section>
<section id="reviews" class="view"><div class="title"><h2>⭐ Վարկանիշ</h2></div><div id="reviewList"></div></section>
<section id="documents" class="view"><div class="title"><h2>📄 Փաստաթղթեր</h2></div><div id="documentList"></div></section>
<section id="settings" class="view"><div class="title"><h2>⚙️ Կարգավորումներ</h2></div><div class="card"><label>Բիզնեսի անուն</label><input id="sName"><label>Նկարագրություն</label><textarea id="sDesc"></textarea><label>Կոնտակտների բացման քաղաքականություն</label><select id="sPolicy"><option value="after_booking">Բացումից հետո ամրագրումից</option><option value="premium">Premium</option><option value="never">Չբացել</option></select><div class="actions"><button class="primary" onclick="saveSettings()">Պահպանել</button></div></div></section>
</main></div>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="title"><h3 id="modalTitle"></h3><button class="secondary" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const init=tg?.initData||'',uid=Number(tg?.initDataUnsafe?.user?.id||0);let lang=localStorage.aig_partner_lang||'hy';
const tr={hy:{dashboard:'Գլխավոր',directions:'Ուղղություններ',services:'Ծառայություններ',objects:'Օբյեկտներ',orders:'Պատվերներ',locations:'Տարածքներ',reviews:'Վարկանիշ',documents:'Փաստաթղթեր',settings:'Կարգավորումներ'},ru:{dashboard:'Главная',directions:'Направления',services:'Услуги',objects:'Объекты',orders:'Заказы',locations:'Локации',reviews:'Рейтинг',documents:'Документы',settings:'Настройки'},en:{dashboard:'Dashboard',directions:'Directions',services:'Services',objects:'Objects',orders:'Orders',locations:'Locations',reviews:'Reviews',documents:'Documents',settings:'Settings'}};
function setLang(x){lang=x;localStorage.aig_partner_lang=x;document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('on',b.id===x));document.querySelectorAll('[data-t]').forEach(e=>e.textContent=tr[x][e.dataset.t]||e.textContent)}setLang(lang);
async function api(path,opt={}){opt.headers={...(opt.headers||{}),'X-Telegram-Init-Data':init,'Content-Type':'application/json'};const r=await fetch(path,opt);const d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw Error(d.error||('HTTP '+r.status));return d}
function esc(x){return String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function badge(s){let c=s==='approved'?'approved':(s==='rejected'?'rejected':'pending');return `<span class="badge ${c}">${esc(s||'—')}</span>`}function empty(el,text='Տվյալներ չկան'){el.innerHTML=`<div class="empty">${esc(text)}</div>`}
function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===id));}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{show(b.dataset.view);if(b.dataset.view==='dashboard'||b.dataset.view==='services'||b.dataset.view==='objects'||b.dataset.view==='orders'||b.dataset.view==='locations'||b.dataset.view==='reviews'||b.dataset.view==='documents')loadAll()});
async function loadDashboard(){const d=await api(`/api/master/${uid}/dashboard`);const p=d.partner||{};document.getElementById('partnerName').textContent=p.business_name||'Գործընկերոջ սենյակ';document.getElementById('metrics').innerHTML=Object.entries({services:d.metrics.services,objects:d.metrics.objects,bookings:d.metrics.bookings,active:d.metrics.active_bookings}).map(([k,v])=>`<div class="card metric">${esc(k)}<b>${esc(v)}</b></div>`).join('');document.getElementById('profileCard').innerHTML=`<div class="row"><div><b>${esc(p.business_name||'')}</b><div class="muted">${esc(p.business_description||'')}</div></div><div>${badge(p.status)}</div></div>`;document.getElementById('dashboardNotice').innerHTML=p.status==='approved'?'<div class="notice">Ձեր գործընկերային պրոֆիլը ակտիվ է։</div>':'<div class="notice">Պրոֆիլը դեռ ստուգման փուլում է։</div>'}
async function loadDirections(){try{const d=await api(`/api/master/${uid}/partner-directions`);const el=document.getElementById('directionList');if(!d.directions?.length)return empty(el);el.innerHTML=d.directions.filter(x=>x.status!=='not_added').map(x=>`<div class="item"><div class="row"><div><b>${esc(x.name_am||x.name_ru)}</b><div class="muted">${(x.subcategories||[]).map(c=>esc(c.name_am||c.name_ru)).join(' · ')||'Ենթաուղղություններ դեռ չկան'}</div></div><div>${badge(x.status)}<div class="muted">Փաստաթղթեր՝ ${esc(x.document_count)}</div></div></div></div>`).join('')}catch(e){empty(document.getElementById('directionList'),'Չհաջողվեց բեռնել ուղղությունները') }}
async function loadServices(){try{const d=await api(`/api/master/${uid}/services`),el=document.getElementById('serviceList');if(!d.services?.length)return empty(el);el.innerHTML=d.services.map(s=>`<div class="item"><div class="row"><div><b>${esc(s.name)}</b><div class="muted">${esc(s.description||'')}</div></div><div>${esc(s.price??'—')} ֏<br>${badge(s.status)}</div></div><div class="actions"><button class="secondary" onclick="editService(${s.id},${JSON.stringify(s.name)},${JSON.stringify(s.price??'')})">Փոխել</button><button class="danger" onclick="deleteService(${s.id})">Ջնջել</button></div></div>`).join('')}catch(e){empty(document.getElementById('serviceList'))}}
async function loadObjects(){const d=await api(`/api/master/${uid}/objects`),el=document.getElementById('objectList');if(!d.objects?.length)return empty(el);el.innerHTML=d.objects.map(o=>`<div class="item"><div class="row"><div><b>${esc(o.object_name)}</b><div class="muted">${esc(o.city||'')} ${esc(o.address||'')}</div></div><button class="danger" onclick="deleteObject(${o.id})">Ջնջել</button></div></div>`).join('')}
async function loadOrders(){const d=await api(`/api/master/${uid}/bookings`),el=document.getElementById('orderList');if(!d.bookings?.length)return empty(el,'Պատվերներ դեռ չկան');el.innerHTML=`<div class="table"><table><tr><th>ID</th><th>Status</th><th>Price</th><th>Created</th></tr>${d.bookings.map(x=>`<tr><td>${esc(x.id)}</td><td>${badge(x.status)}</td><td>${esc(x.agreed_price??'—')} ֏</td><td>${esc(String(x.created_at||'').slice(0,19))}</td></tr>`).join('')}</table></div>`}
async function loadLocations(){const d=await api(`/api/master/${uid}/locations`),el=document.getElementById('locationList');if(!d.locations?.length)return empty(el);el.innerHTML=d.locations.map(x=>`<div class="item"><b>${esc(x.city||x.village||x.marz||'Armenia')}</b><div class="muted">${esc(x.address||'')}</div></div>`).join('')}
async function loadReviews(){const d=await api(`/api/master/${uid}/reviews`),el=document.getElementById('reviewList');if(!d.reviews?.length)return empty(el);el.innerHTML=d.reviews.map(x=>`<div class="item"><b>⭐ ${esc(x.rating)}/5</b><div>${esc(x.comment||'')}</div></div>`).join('')}
async function loadDocuments(){const d=await api(`/api/master/${uid}/documents`),el=document.getElementById('documentList');el.innerHTML=(d.documents?.length?d.documents.map(x=>`<div class="item"><div class="row"><div><b>${esc(x.original_filename||'document')}</b><div class="muted">${esc(x.document_type)} · ${esc(x.file_size||0)} bytes</div></div>${badge(x.status)}</div>${x.rejection_reason?`<div class="muted">${esc(x.rejection_reason)}</div>`:''}</div>`).join(''):'<div class="empty">Փաստաթղթեր դեռ չկան</div>')+`<div class="card"><b>📤 Փաստաթուղթ ուղարկել / կրկին ուղարկել</b><input id="docUpload" type="file" accept="image/*,.pdf"><div class="actions"><button class="primary" onclick="uploadDocument()">Ուղարկել</button></div><div id="docUploadStatus" class="muted"></div></div>`}
async function loadSettings(){const d=await api(`/api/master/${uid}/settings`),s=d.settings||{};sName.value=s.business_name||'';sDesc.value=s.business_description||'';sPolicy.value=s.contact_share_policy||'after_booking'}
async function saveSettings(){await api(`/api/master/${uid}/settings`,{method:'POST',body:JSON.stringify({business_name:sName.value,business_description:sDesc.value,contact_share_policy:sPolicy.value,lang})});alert('Պահպանվեց')}
async function uploadDocument(){const f=document.getElementById('docUpload')?.files?.[0],s=document.getElementById('docUploadStatus');if(!f){s.textContent='Ընտրեք փաստաթուղթ';return}if(f.size>10*1024*1024){s.textContent='Ֆայլը մեծ է (մինչև 10 MB)';return}const fd=new FormData();fd.append('file',f,f.name);fd.append('document_type','business_verification');try{const r=await fetch('/api/master/'+uid+'/documents/upload',{method:'POST',headers:{'X-Telegram-Init-Data':init},body:fd});const d=await r.json();if(!r.ok||d.ok===false)throw Error(d.error||('HTTP '+r.status));s.textContent='✅ Փաստաթուղթը ուղարկված է';await loadDocuments()}catch(e){s.textContent='❌ '+e.message}}
function openModal(title,body){modalTitle.textContent=title;modalBody.innerHTML=body;modal.classList.remove('hidden')}function closeModal(){modal.classList.add('hidden')}
function openService(){openModal('Նոր ծառայություն',`<label>Անվանում</label><input id="mName"><label>Գին, AMD</label><input id="mPrice" type="number"><label>Նկարագրություն</label><textarea id="mDesc"></textarea><div class="actions"><button class="primary" onclick="createService()">Պահպանել</button></div>`)}
async function createService(){await api(`/api/master/${uid}/services`,{method:'POST',body:JSON.stringify({name:mName.value,price:mPrice.value||null,description:mDesc.value})});closeModal();loadServices()}
function editService(id,name,price){openModal('Փոփոխել ծառայությունը',`<label>Անվանում</label><input id="mName" value="${esc(name)}"><label>Գին</label><input id="mPrice" type="number" value="${esc(price)}"><div class="actions"><button class="primary" onclick="updateService(${id})">Պահպանել</button></div>`)}
async function updateService(id){await api(`/api/master/${uid}/services/${id}`,{method:'POST',body:JSON.stringify({name:mName.value,price:mPrice.value||null})});closeModal();loadServices()}
async function deleteService(id){if(!confirm('Ջնջե՞լ ծառայությունը'))return;await api(`/api/master/${uid}/services/${id}`,{method:'DELETE'});loadServices()}
function openObject(){openModal('Նոր օբյեկտ',`<label>Անվանում</label><input id="oName"><label>Քաղաք</label><input id="oCity"><label>Հասցե</label><input id="oAddress"><div class="actions"><button class="primary" onclick="createObject()">Պահպանել</button></div>`)}
async function createObject(){await api(`/api/master/${uid}/objects`,{method:'POST',body:JSON.stringify({object_name:oName.value,city:oCity.value,address:oAddress.value})});closeModal();loadObjects()}
async function deleteObject(id){if(!confirm('Ջնջե՞լ օբյեկտը'))return;await api(`/api/master/${uid}/objects/${id}`,{method:'DELETE'});loadObjects()}
async function loadAll(){if(!init){document.body.innerHTML='<div style="padding:30px">Բացեք գործընկերոջ սենյակը Telegram հավելվածում։</div>';return}try{await Promise.all([loadDashboard(),loadDirections(),loadServices(),loadObjects(),loadOrders(),loadLocations(),loadReviews(),loadDocuments(),loadSettings()])}catch(e){console.error(e)}}
loadAll();
</script></body></html>
