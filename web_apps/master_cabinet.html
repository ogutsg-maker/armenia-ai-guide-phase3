<html lang="hy">
<head>
<meta charset="utf-8">

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:18px;z-index:9999}.modal-card{width:min(680px,100%);max-height:90vh;overflow:auto;background:var(--card,#17191f);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35)}.modal-card textarea{min-height:110px;resize:vertical}
:root{--bg:#f4f6fa;--card:#fff;--text:#182033;--muted:#707b8f;--line:#e2e7ef;--accent:#635bdb;--ok:#16834b;--warn:#a36a00;--danger:#c13d3d;--dark:#121826}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:var(--dark);color:#fff;padding:12px 16px}.topin{max-width:1180px;margin:auto;display:flex;align-items:center;gap:12px;justify-content:space-between}.brand{font-weight:850;font-size:17px}.sub{font-size:11px;color:#aeb6c5;margin-top:2px}.tools{display:flex;align-items:center;gap:7px}.tools select,.tools button{background:#fff1;border:1px solid #ffffff2d;color:#fff;border-radius:9px;padding:7px 9px}.tools .active{background:#fff;color:#111827}
.shell{max-width:1180px;margin:auto;display:grid;grid-template-columns:215px 1fr;min-height:calc(100vh - 62px)}
nav{background:#fff;border-right:1px solid var(--line);padding:12px;position:sticky;top:62px;height:calc(100vh - 62px)}nav button{width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:10px;color:#566176;font-weight:750;margin:2px 0}nav button.active,nav button:hover{background:#eeeafd;color:var(--accent)}
main{padding:20px;min-width:0}.view{display:none}.view.on{display:block}.back{border:0;background:none;color:var(--accent);font-weight:800;padding:0;margin-bottom:12px}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.heading h1{font-size:23px;margin:0}.heading p{margin:4px 0 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:0 1px 2px #10182808}.click{cursor:pointer}.click:hover{border-color:#c9c3ff;transform:translateY(-1px)}.name{font-weight:850;font-size:16px}.muted{color:var(--muted)}.small{font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stack>*+*{margin-top:9px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chip{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;background:#f0f2f7;color:#596477;font-size:12px}.ok{background:#e7f6ee;color:var(--ok)}.warn{background:#fff4df;color:var(--warn)}.bad{background:#fdecec;color:var(--danger)}.accent{background:#eeeafd;color:#554bc8}.metric{font-size:26px;font-weight:900;margin-top:5px}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed #cfd5df;border-radius:14px;background:#fff}.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:800;background:var(--accent);color:#fff}.btn.secondary{background:#eef0f5;color:#30394b}.btn.danger{background:#fde9e9;color:var(--danger)}.btn.smallbtn{padding:7px 9px;font-size:12px}
.list{display:grid;gap:10px}.item{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px}.item.click:hover{border-color:#c9c3ff}.detail{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.detail h2{margin:0 0 5px}.section{margin-top:16px}.section h3{font-size:14px;margin:0 0 9px}.actions{display:flex;gap:7px;flex-wrap:wrap}.field{display:grid;gap:5px;margin-top:10px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff;color:var(--text)}.field textarea{min-height:90px;resize:vertical}.notice{padding:12px;border-radius:12px;background:#f5f1ff;color:#4d43a8}.hr{height:1px;background:var(--line);margin:16px 0}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:10px;z-index:100;display:none;max-width:90%}
@media(max-width:850px){.shell{display:block}nav{position:sticky;top:62px;height:auto;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:7px;gap:5px;z-index:15}nav button{white-space:nowrap;width:auto;margin:0;padding:9px 11px}main{padding:14px}.grid{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.tools select{max-width:130px}}
@media(max-width:560px){.grid{grid-template-columns:1fr}.heading h1{font-size:20px}.topin{align-items:flex-start}.sub{display:none}.tools select{max-width:105px}}
</style>

<body>
<header class="top"><div class="topin"><div><div class="brand">🤝 Armenia AI Guide</div><div class="sub">Գործընկերոջ աշխատանքային տարածք</div></div><div class="tools"><select id="businessSelect"></select><div id="langs"><button data-lang="hy">AM</button><button data-lang="ru">RU</button><button data-lang="en">EN</button></div></div></div></header>
<div class="shell">
<nav id="nav">
<button data-view="businesses">🏢 <span data-i="businesses">Իմ ընկերությունները</span></button>
<button data-view="orders">📥 <span data-i="orders">Պատվերներ</span></button>
<button data-view="negotiations">💬 <span data-i="negotiations">Բանակցություններ</span></button>
<button data-view="settings">⚙️ <span data-i="settings">Կարգավորումներ</span></button>
</nav>
<main>
<section id="businesses" class="view on"></section>
<section id="business" class="view"></section>
<section id="direction" class="view"></section>
<section id="service" class="view"></section>
<section id="application" class="view"></section>
<section id="applications" class="view"></section>
<section id="orders" class="view"></section>
<section id="negotiations" class="view"></section>
<section id="settings" class="view"></section>
</main></div>
<div id="toast" class="toast"></div>
<script>
const tg=window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const state={lang:(tg?.initDataUnsafe?.user?.language_code||'hy').startsWith('ru')?'ru':'hy',businesses:[],current:null,locations:[],services:[],documents:[],applications:[],bookings:[],reviews:[],stack:[]};
const T={
hy:{company:'Ընկերություն',object:'Օբյեկտ',selectObject:'Ընտրեք օբյեկտը',objectName:'Օբյեկտի անվանում',marz:'Մարզ',autoFromObject:'կընտրվի օբյեկտից',optionalNew:'կամ նոր հեռախոս',objectDataRequired:'Լրացրեք օբյեկտի անվանումը, հասցեն և քաղաքը',businesses:'Իմ ընկերությունները',applications:'Հայտեր',orders:'Պատվերներ',negotiations:'Բանակցություններ',settings:'Կարգավորումներ',objects:'Հասցեներ',directions:'',services:'Ծառայություններ',territories:'',documents:'Փաստաթղթեր',companyInfo:'Ընկերության տվյալներ',companySettings:'Ընկերության կարգավորումներ',objectEdit:'Խմբագրել օբյեկտը',serviceEdit:'Խմբագրել ծառայությունը',companySettingsHint:'Տվյալ ընկերության տվյալների խմբագրում',saved:'Պահպանված',open:'Բացել',back:'← Հետ',pending:'Սպասում է',approved:'Հաստատված',active:'Ակտիվ',rejected:'Մերժված',newCompany:'＋ Նոր ընկերություն',empty:'Տվյալներ դեռ չկան',save:'Պահպանել',addObject:'＋ Օբյեկտ',addService:'＋ Նոր ծառայություն',all:'Բոլորը',applicationInfo:'Հայտի ընթացք',noOrders:'Պատվերներ դեռ չկան',noNegotiations:'Բանակցություններ դեռ չկան',global:'Ընդհանուր կարգավորումներ',name:'Անվանում',description:'Նկարագրություն',phoneCompany:'Հեռախոս',city:'Քաղաք',address:'Հասցե',phone:'Հեռախոս',status:'Կարգավիճակ',classification:'AI դասակարգում',document:'Փաստաթուղթ',price:'Գին',direction:'Ուղղություն',subcategory:'Ենթաուղղություն'},
ru:{company:'Компания',object:'Объект',selectObject:'Выберите объект',objectName:'Название объекта',marz:'Марз',autoFromObject:'подтянется из объекта',optionalNew:'или новый телефон',objectDataRequired:'Заполните название объекта, адрес и город',businesses:'Мои компании',applications:'Заявки',orders:'Заказы',negotiations:'Переговоры',settings:'Настройки',objects:'Адреса',directions:'',services:'Услуги',territories:'',documents:'Документы',companyInfo:'Данные компании',companySettings:'Настройки компании',objectEdit:'Редактировать объект',serviceEdit:'Редактировать услугу',companySettingsHint:'Редактирование данных этой компании',saved:'Сохранено',open:'Открыть',back:'← Назад',pending:'На проверке',approved:'Подтверждено',active:'Активно',rejected:'Отклонено',newCompany:'＋ Новая компания',empty:'Данных пока нет',save:'Сохранить',addObject:'＋ Объект',addService:'＋ Новая услуга',all:'Все',applicationInfo:'Ход заявки',noOrders:'Заказов пока нет',noNegotiations:'Переговоров пока нет',global:'Общие настройки',name:'Название',description:'Описание',phoneCompany:'Телефон',city:'Город',address:'Адрес',phone:'Телефон',status:'Статус',classification:'AI-классификация',document:'Документ',price:'Цена',direction:'Направление',subcategory:'Подкатегория'},
en:{company:'Company',object:'Object',selectObject:'Select an object',objectName:'Object name',marz:'Marz',autoFromObject:'taken from object',optionalNew:'or new phone',objectDataRequired:'Fill object name, address and city',businesses:'My companies',applications:'Applications',orders:'Orders',negotiations:'Negotiations',settings:'Settings',objects:'Addresses',directions:'',services:'Services',territories:'',documents:'Documents',companyInfo:'Company information',companySettings:'Company settings',objectEdit:'Edit object',serviceEdit:'Edit service',companySettingsHint:'Edit this company',saved:'Saved',open:'Open',back:'← Back',pending:'Pending',approved:'Approved',active:'Active',rejected:'Rejected',newCompany:'＋ New company',empty:'No data yet',save:'Save',addObject:'＋ Object',addService:'＋ New service',all:'All',applicationInfo:'Application progress',noOrders:'No orders yet',noNegotiations:'No negotiations yet',global:'General settings',name:'Name',description:'Description',phoneCompany:'Phone',city:'City',address:'Address',phone:'Phone',status:'Status',classification:'AI classification',document:'Document',price:'Price',direction:'Direction',subcategory:'Subcategory'}
};
const tr=k=>(T[state.lang]||T.hy)[k]||k;
function headers(){return {'X-Telegram-Init-Data':tg?.initData||''};}
async function api(path,opt={}){opt.headers={...headers(),...(opt.headers||{})};if(opt.body&&typeof opt.body!=='string'){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)}const r=await fetch(path,opt);const d=await r.json().catch(()=>({ok:false,error:'bad_json'}));if(!r.ok||d.ok===false)throw new Error(d.error||d.message||('HTTP '+r.status));return d}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function status(s){s=String(s||'').toLowerCase();let cls=s==='approved'||s==='active'?'ok':s==='rejected'?'bad':'warn';let label={approved:tr('approved'),active:tr('active'),pending:tr('pending'),pending_admin:tr('pending'),pending_partner:tr('pending'),document_pending:tr('pending'),document_under_review:tr('pending'),needs_clarification:tr('pending'),draft:tr('pending'),rejected:tr('rejected')}[s]||s;return '<span class="chip '+cls+'">'+esc(label)+'</span>'}
function toast(x){const e=document.getElementById('toast');e.textContent=x;e.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.style.display='none',2600)}
function setView(id, push=true){document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));document.getElementById(id)?.classList.add('on');document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===id));if(push)state.stack.push(id)}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>openMain(b.dataset.view));
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{state.lang=b.dataset.lang;document.documentElement.lang=state.lang;applyLang();renderAll()});
function applyLang(){document.querySelectorAll('[data-i]').forEach(e=>e.textContent=tr(e.dataset.i));document.querySelectorAll('[data-lang]').forEach(e=>e.classList.toggle('active',e.dataset.lang===state.lang));}
document.getElementById('businessSelect').onchange=e=>{state.current=state.businesses.find(x=>String(x.id)===e.target.value)||state.businesses[0]||null;if(state.current)openBusiness(state.current.id)};
async function loadBusinesses(){const d=await api('/api/master/0/businesses');state.businesses=d.businesses||[];state.current=d.current||state.businesses[0]||null;const s=document.getElementById('businessSelect');s.innerHTML=state.businesses.map(b=>'<option value="'+b.id+'">'+esc(b.name)+'</option>').join('');if(state.current)s.value=state.current.id;}
async function loadBusinessData(){if(!state.current)return;const h={'X-Business-Id':String(state.current.id)};const safe=async(path,empty)=>{try{return await api(path,{headers:h})}catch(e){console.warn(path,e);return empty}};const [l,s,d]=await Promise.all([safe('/api/master/0/locations',{locations:[]}),safe('/api/master/0/services',{services:[]}),safe('/api/master/0/documents',{documents:[]})]);state.locations=l.locations||[];state.services=s.services||[];state.documents=d.documents||d.docs||[];}
async function loadApplications(){const d=await api('/api/master/0/applications');state.applications=d.applications||[]}
async function openMain(id){try{if(id==='businesses'){renderBusinesses();setView('businesses')}if(id==='applications'){await loadApplications();renderApplications();setView('applications')}if(id==='orders'){const d=await api('/api/master/0/bookings');state.bookings=d.bookings||[];renderOrders();setView('orders')}if(id==='negotiations'){renderNegotiations();setView('negotiations')}if(id==='settings'){const d=await api('/api/master/0/settings');state.settings=d.settings||{};renderSettings();setView('settings')}}catch(e){toast(e.message)}}
function renderBusinesses(){document.getElementById('businesses').innerHTML='<div class="heading"><div><h1>'+tr('businesses')+'</h1><p>Յուրաքանչյուր ընկերություն ունի իր առանձին աշխատանքային սենյակը։</p></div><button class="btn" onclick="createBusiness()">'+tr('newCompany')+'</button></div><div class="grid">'+(state.businesses.length?state.businesses.map(b=>'<div class="card click" onclick="openBusiness('+b.id+')"><div class="row"><div class="name">🏢 '+esc(b.name)+'</div>'+status(b.status)+'</div><p class="muted">'+esc(b.description||'')+'</p><div class="actions"><button class="btn smallbtn" onclick="event.stopPropagation();openBusiness('+b.id+')">'+tr('open')+' →</button></div></div>').join(''):'<div class="empty">'+tr('empty')+'</div>')+'</div>'}
async function deleteBusiness(id){const b=state.businesses.find(x=>String(x.id)===String(id));if(!b)return;if(!confirm((tr('delete')||'Delete')+' '+(b.name||'')+'?'))return;try{await api('/api/master/0/businesses/'+id,{method:'DELETE'});await loadBusinesses();renderBusinesses();toast('✓ '+tr('deleted'))}catch(e){toast(e.message)}}
async function createBusiness(){const name=prompt(tr('name'));if(!name)return;try{await api('/api/master/0/businesses',{method:'POST',body:{name}});await loadBusinesses();renderBusinesses();toast('✓')}catch(e){toast(e.message)}}
async function openBusiness(id){state.current=state.businesses.find(x=>String(x.id)===String(id))||state.current;document.getElementById('businessSelect').value=state.current?.id||'';try{await loadBusinessData();renderBusiness();setView('business',false)}catch(e){toast(e.message)}}
function renderBusiness(){const b=state.current||{};document.getElementById('business').innerHTML='<button class="back" onclick="openMain(\\'businesses\\')">'+tr('back')+'</button><div class="heading"><div><h1>🏢 '+esc(b.name)+'</h1><p>'+esc(b.description||'')+'</p></div><button class="btn secondary" onclick="editCompany()">✎ '+tr('companySettings')+'</button></div><div class="grid2"><div class="card"><div class="row"><div class="name">📍 '+tr('objects')+'</div><button class="btn smallbtn" onclick="addLocation()">＋</button></div><div class="metric">'+state.locations.length+'</div><div class="muted">'+(state.lang==='hy'?'Ընկերության հասցեներ':state.lang==='ru'?'Адреса компании':'Company addresses')+'</div></div><div class="card"><div class="name">🛠 '+tr('services')+'</div><div class="metric">'+state.services.length+'</div><div class="muted">'+(state.lang==='hy'?'Ծառայությունները կապված են ընկերության հասցեների հետ':state.lang==='ru'?'Услуги привязаны к адресам компании':'Services are linked to company addresses')+'</div></div></div><div id="companySection" class="section"></div>';showCompanySection('overview')}
function showCompanySection(kind){const e=document.getElementById('companySection');if(!e)return;const title=kind==='services'?'🛠 '+tr('services'):kind==='documents'?'📄 '+tr('documents'):'📍 '+tr('objects');if(kind==='overview'){e.innerHTML='<div class="detail"><div class="heading"><div><h2>📍 '+tr('objects')+'</h2><p>'+ (state.lang==='hy'?'Հասցեները պատկանում են ընկերությանը։ Ծառայությունը կարող է ընտրվել ցանկացած հասցեի համար։':state.lang==='ru'?'Адреса принадлежат компании. Каждую услугу можно привязать к любому адресу.':'Addresses belong to the company. Each service can be linked to any company address.')+'</p></div><button class="btn" onclick="addLocation()">＋</button></div><div class="list">'+(state.locations.length?state.locations.map(l=>locationCard(l)).join(''):'<div class="empty">'+tr('empty')+'</div>')+'</div></div><div class="detail section"><div class="heading"><h2>🛠 '+tr('services')+'</h2><button class="btn" onclick="addService()">＋</button></div><div class="list">'+(state.services.length?state.services.map(serviceCard).join(''):'<div class="empty">'+tr('empty')+'</div>')+'</div></div><div class="detail section"><div class="heading"><h2>📄 '+tr('documents')+'</h2></div><div class="list">'+(state.documents.length?state.documents.map(d=>'<div class="item"><div class="row"><b>📄 '+esc(d.original_filename||d.document_type||'Document')+'</b>'+status(d.status)+'</div></div>').join(''):'<div class="empty">'+tr('empty')+'</div>')+'</div></div>';return}if(kind==='locations'){e.innerHTML='<div class="detail"><div class="heading"><h2>'+title+'</h2><button class="btn" onclick="addLocation()">＋</button></div><div class="list">'+(state.locations.length?state.locations.map(locationCard).join(''):'<div class="empty">'+tr('empty')+'</div>')+'</div></div>';return}if(kind==='services'){e.innerHTML='<div class="detail"><div class="heading"><h2>'+title+'</h2><button class="btn" onclick="addService()">＋</button></div><div class="list">'+(state.services.length?state.services.map(serviceCard).join(''):'<div class="empty">'+tr('empty')+'</div>')+'</div></div>';return}}
function locationCard(l){return '<div class="item"><div class="row"><b>📍 '+esc(l.address||'')+'</b><div class="actions"><button class="btn secondary smallbtn" onclick="editLocation('+l.id+')">✎</button><button class="btn danger smallbtn" onclick="deleteLocation('+l.id+')">🗑</button></div></div><div class="muted">'+esc([l.city,l.marz].filter(Boolean).join(' · '))+'</div>'+(l.phone?'<div class="small muted">📞 '+esc(l.phone)+'</div>':'')+'</div>'}
function serviceCard(s){const loc=state.locations.find(l=>String(l.id)===String(s.location_id));return '<div class="item"><div class="row"><b>🛠 '+esc(s.name||'')+'</b><div class="actions"><button class="btn secondary smallbtn" onclick="editService('+s.id+')">✎</button><button class="btn danger smallbtn" onclick="deleteService('+s.id+')">🗑</button></div></div><div><b>'+esc(s.price??'')+' AMD</b></div><div class="muted">📍 '+esc(loc?([loc.address,loc.city].filter(Boolean).join(', ')):(s.address||'—'))+'</div></div>'}
async function addLocation(){const address=prompt(tr('address'));if(!address)return;const city=prompt(tr('city'));if(!city)return;const marz=prompt(tr('marz'));const phone=prompt(tr('phone'));try{await api('/api/master/0/locations',{method:'POST',headers:{'X-Business-Id':String(state.current.id)},body:{address,city,marz,phone}});await loadBusinessData();renderBusiness();toast('✓ '+tr('saved'))}catch(e){toast(e.message)}}
async function editLocation(id){const l=state.locations.find(x=>String(x.id)===String(id));if(!l)return;const address=prompt(tr('address'),l.address||'');if(address===null)return;const city=prompt(tr('city'),l.city||'');if(city===null)return;const marz=prompt(tr('marz'),l.marz||'');const phone=prompt(tr('phone'),l.phone||'');try{await api('/api/master/0/locations/'+id,{method:'POST',headers:{'X-Business-Id':String(state.current.id)},body:{address,city,marz,phone}});await loadBusinessData();renderBusiness();toast('✓ '+tr('saved'))}catch(e){toast(e.message)}}
async function deleteLocation(id){if(!confirm(state.lang==='hy'?'Ջնջե՞լ հասցեն։':state.lang==='ru'?'Удалить адрес?':'Delete address?'))return;try{await api('/api/master/0/locations/'+id,{method:'DELETE',headers:{'X-Business-Id':String(state.current.id)}});await loadBusinessData();renderBusiness();toast('✓')}catch(e){toast(e.message)}}
function editCompany(){
  const b=state.current;if(!b)return;
  const e=document.getElementById('companySection');if(!e)return;
  e.innerHTML='<div class="detail"><div class="heading"><div><h2>⚙️ '+tr('companySettings')+'</h2><p>'+tr('companySettingsHint')+'</p></div></div>'+
    '<div class="field"><label>'+tr('name')+'</label><input id="editCompanyName" value="'+esc(b.name||'')+'"></div>'+
    '<div class="field"><label>'+tr('description')+'</label><textarea id="editCompanyDescription">'+esc(b.description||'')+'</textarea></div>'+'<div class="field"><label>'+tr('phoneCompany')+'</label><input id="editCompanyPhone" type="tel" inputmode="tel" autocomplete="tel" value="'+esc(b.phone||'')+'"></div>'+
    '<div class="actions" style="margin-top:14px"><button class="btn secondary" onclick="showCompanySection(\'overview\')">'+tr('back')+'</button><button class="btn" onclick="saveCompanyEdit('+b.id+')">✓ '+tr('save')+'</button></div></div>';
  e.querySelector('#editCompanyName')?.focus();
}
async function saveCompanyEdit(id){
  const b=state.businesses.find(x=>String(x.id)===String(id));if(!b)return;
  const name=document.getElementById('editCompanyName')?.value.trim()||'';
  const description=document.getElementById('editCompanyDescription')?.value||'';
  const phone=document.getElementById('editCompanyPhone')?.value.trim()||'';
  if(name.length<2){toast(tr('name'));return}
  try{
    const d=await api('/api/master/0/businesses/'+id,{method:'POST',body:{name,description,phone}});
    const ix=state.businesses.findIndex(x=>String(x.id)===String(id));if(ix>=0)state.businesses[ix]=d.business;
    state.current=state.businesses[ix>=0?ix:0]||d.business;
    document.getElementById('businessSelect').value=state.current.id;
    await loadBusinessData();renderBusiness();showCompanySection('settings');toast('✓ '+tr('saved'));
  }catch(e){toast(e.message)}
}
function editObject(id){
  const o=state.objects.find(x=>String(x.id)===String(id));if(!o)return;
  const e=document.getElementById('business');if(!e)return;
  e.innerHTML='<button class="back" onclick="objectRoom('+o.id+')">'+tr('back')+'</button><div class="detail"><div class="heading"><div><h2>✎ '+tr('objects')+'</h2><p>'+esc(o.object_name||o.name||'')+'</p></div></div>'+
    '<div class="field"><label>'+tr('name')+'</label><input id="editObjectName" value="'+esc(o.object_name||o.name||'')+'"></div>'+
    '<div class="field"><label>'+tr('city')+'</label><input id="editObjectCity" value="'+esc(o.city||'')+'"></div>'+
    '<div class="field"><label>'+tr('address')+'</label><input id="editObjectAddress" value="'+esc(o.address||'')+'"></div>'+
    '<div class="field"><label>Մարզ / Marz</label><input id="editObjectMarz" value="'+esc(o.marz||'')+'"></div>'+
    '<div class="section"><h3>🕘 '+(state.lang==='hy'?'Աշխատանքային ժամեր':state.lang==='ru'?'Рабочие часы':'Working hours')+'</h3>'+
    ['mon','tue','wed','thu','fri','sat','sun'].map(function(k){const h=objectHours(o)[k]||{};const labels={hy:{mon:'Երկուշաբթի',tue:'Երեքշաբթի',wed:'Չորեքշաբթի',thu:'Հինգշաբթի',fri:'Ուրբաթ',sat:'Շաբաթ',sun:'Կիրակի'},ru:{mon:'Понедельник',tue:'Вторник',wed:'Среда',thu:'Четверг',fri:'Пятница',sat:'Суббота',sun:'Воскресенье'},en:{mon:'Monday',tue:'Tuesday',wed:'Wednesday',thu:'Thursday',fri:'Friday',sat:'Saturday',sun:'Sunday'}}[state.lang]||{};return '<div class="grid2"><div class="field"><label>'+labels[k]+' — '+(state.lang==='hy'?'սկիզբ':state.lang==='ru'?'начало':'from')+'</label><input type="time" id="hour_'+k+'_from" value="'+esc(h.from||'')+'"></div><div class="field"><label>'+labels[k]+' — '+(state.lang==='hy'?'վերջ':state.lang==='ru'?'конец':'to')+'</label><input type="time" id="hour_'+k+'_to" value="'+esc(h.to||'')+'"></div></div><label style="display:flex;gap:8px;align-items:center;margin-top:7px"><input type="checkbox" id="hour_'+k+'_closed" '+(h.closed?'checked':'')+'> '+(state.lang==='hy'?'Հանգստյան օր':state.lang==='ru'?'Выходной':'Closed')+'</label>'}).join('')+'</div>'+
    '<div class="actions" style="margin-top:14px"><button class="btn secondary" onclick="objectRoom('+o.id+')">'+tr('back')+'</button><button class="btn" onclick="saveObjectEdit('+o.id+')">✓ '+tr('save')+'</button></div></div>';
  document.getElementById('editObjectName')?.focus();
  setView('business',false);
}
async function saveObjectEdit(id){
  const o=state.objects.find(x=>String(x.id)===String(id));if(!o||!state.current)return;
  const name=document.getElementById('editObjectName')?.value.trim()||'';
  const city=document.getElementById('editObjectCity')?.value.trim()||'';
  const address=document.getElementById('editObjectAddress')?.value.trim()||'';
  const marz=document.getElementById('editObjectMarz')?.value.trim()||'';
  const working_hours={};
  ['mon','tue','wed','thu','fri','sat','sun'].forEach(function(k){const closedEl=document.getElementById('hour_'+k+'_closed');const fromEl=document.getElementById('hour_'+k+'_from');const toEl=document.getElementById('hour_'+k+'_to');const closed=!!closedEl?.checked;const from=String(fromEl?.value||'').trim();const to=String(toEl?.value||'').trim();working_hours[k]=closed?{closed:true}:{from,to};if(closed){if(fromEl)fromEl.value='';if(toEl)toEl.value='';}});
  if(name.length<2){toast(tr('name'));return}
  try{
    const d=await api('/api/master/0/objects/'+id,{method:'POST',headers:{'X-Business-Id':String(state.current.id)},body:{object_name:name,city,address,marz,working_hours}});
    const ix=state.objects.findIndex(x=>String(x.id)===String(id));if(ix>=0)state.objects[ix]=d.object;
    objectRoom(id);toast('✓ '+tr('saved'));
  }catch(e){toast(e.message)}
}
async function deleteService(id){if(!confirm(state.lang==='hy'?'Ջնջե՞լ ծառայությունը։':state.lang==='ru'?'Удалить услугу?':'Delete service?'))return;try{await api('/api/master/0/services/'+id,{method:'DELETE',headers:{'X-Business-Id':String(state.current.id)}});await loadBusinessData();renderBusiness();toast('✓')}catch(e){toast(e.message)}}
function editService(id){const s=state.services.find(x=>String(x.id)===String(id));if(!s)return;const loc=state.locations.find(l=>String(l.id)===String(s.location_id));document.getElementById('service').innerHTML='<button class="back" onclick="openBusiness('+state.current.id+')">'+tr('back')+'</button><div class="detail"><h2>✎ '+tr('serviceEdit')+'</h2><p>'+esc(s.name||'')+'</p><div class="field"><label>'+tr('name')+'</label><input id="editServiceName" value="'+esc(s.name||'')+'"></div><div class="field"><label>📍 '+tr('address')+'</label><select id="editServiceLocation">'+state.locations.map(l=>'<option value="'+l.id+'" '+(loc&&String(l.id)===String(loc.id)?'selected':'')+'>📍 '+esc([l.address,l.city].filter(Boolean).join(', '))+'</option>').join('')+'</select></div><div class="field"><label>'+tr('price')+'</label><input id="editServicePrice" type="number" value="'+esc(s.price??'')+'"></div><div class="field"><label>'+tr('description')+'</label><textarea id="editServiceDescription">'+esc(s.description||'')+'</textarea></div><div class="actions"><button class="btn secondary" onclick="openBusiness('+state.current.id+')">'+tr('back')+'</button><button class="btn" onclick="saveServiceEdit('+s.id+')">✓ '+tr('save')+'</button></div></div>';setView('service',false)}
async function saveServiceEdit(id){
  const s=state.services.find(x=>String(x.id)===String(id));if(!s||!state.current)return;
  const name=document.getElementById('editServiceName')?.value.trim()||'';
  const priceRaw=document.getElementById('editServicePrice')?.value.trim()||'';
  const description=document.getElementById('editServiceDescription')?.value||'';const location_id=Number(document.getElementById('editServiceLocation')?.value||0);
  if(name.length<2){toast(tr('name'));return}
  if(priceRaw!==''&&(!Number.isFinite(Number(priceRaw))||Number(priceRaw)<0)){toast(tr('price'));return}
  try{
    const d=await api('/api/master/0/services/'+id,{method:'POST',headers:{'X-Business-Id':String(state.current.id)},body:{name,description,price:priceRaw===''?null:Number(priceRaw),location_id}});
    const ix=state.services.findIndex(x=>String(x.id)===String(id));if(ix>=0)state.services[ix]=d.service;
    openService(id);toast('✓ '+tr('saved'));
  }catch(e){toast(e.message)}
}
function closeServiceCreate(){document.getElementById('serviceCreateModal')?.remove()}
function addService(){closeServiceCreate();const modal=document.createElement('div');modal.id='serviceCreateModal';modal.className='modal';const locations=state.locations.map(l=>'<option value="'+l.id+'">📍 '+esc([l.address,l.city].filter(Boolean).join(', '))+'</option>').join('');modal.innerHTML='<div class="modal-card"><div class="heading"><div><h2>🛠 '+tr('addService')+'</h2><p>'+(state.lang==='hy'?'Ընտրեք ընկերության հասցեն և ավելացրեք ծառայությունը։ AI-ը ներսում կդասակարգի այն։':state.lang==='ru'?'Выберите адрес компании и добавьте услугу. AI классифицирует её внутри системы.':'Choose a company address and add the service. AI classifies it internally.')+'</p></div><button class="btn secondary" onclick="closeServiceCreate()">✕</button></div><div class="field"><label>📍 '+tr('address')+'</label><select id="newServiceLocation">'+(locations||'<option value="">—</option>')+'</select></div><div class="field"><label>🛠 '+tr('name')+'</label><input id="newServiceName"></div><div class="field"><label>'+tr('description')+'</label><textarea id="newServiceDescription"></textarea></div><div class="field"><label>💰 '+tr('price')+'</label><input id="newServicePrice" type="number" min="0" step="1"></div><div class="actions"><button class="btn secondary" onclick="closeServiceCreate()">'+tr('back')+'</button><button class="btn" onclick="submitNewService()">✓ '+tr('save')+'</button></div></div>';document.body.appendChild(modal);document.getElementById('newServiceName')?.focus()}
async function submitNewService(){const locationId=document.getElementById('newServiceLocation')?.value||'';const name=document.getElementById('newServiceName')?.value.trim()||'';const description=document.getElementById('newServiceDescription')?.value.trim()||'';const priceRaw=document.getElementById('newServicePrice')?.value.trim()||'';if(!locationId){toast(tr('address'));return}if(name.length<2){toast(tr('name'));return}if(priceRaw!==''&&(!Number.isFinite(Number(priceRaw))||Number(priceRaw)<0)){toast(tr('price'));return}try{const d=await api('/api/master/0/services',{method:'POST',headers:{'X-Business-Id':String(state.current.id)},body:{name,description,price:priceRaw===''?null:Number(priceRaw),location_id:Number(locationId)}});closeServiceCreate();await openBusiness(state.current.id);showCompanySection('overview');toast(d.proposal_created?'Հայտը ուղարկվեց ադմինիստրատորին':'✓ '+tr('saved'))}catch(e){toast(e.message)}}
function renderApplications(){document.getElementById('applications').innerHTML='<div class="heading"><div><h1>📨 '+tr('applications')+'</h1><p>Այստեղ միայն ընթացակարգերն են։ Ավարտված հայտը այլևս այստեղ չի մնում որպես ակտիվ գործընթաց։</p></div></div><div class="list">'+(state.applications.length?state.applications.map(a=>'<div class="item click" onclick="openApplication('+a.id+')"><div class="row"><b>#'+a.id+' · '+esc(a.service_name||a.business_name||'Հայտ')+'</b>'+status(a.status)+'</div><div class="muted">'+esc(a.business_name_db||a.business_name||'')+' · '+esc(a.direction_name||a.master_name_am||'')+'</div><div class="chips"><span class="chip">'+esc(a.category_name_am||a.category_name_ru||'AI')+'</span>'+(a.document_id?'<span class="chip ok">📄 '+tr('document')+'</span>':'')+'</div></div>').join(''):'<div class="empty">'+tr('empty')+'</div>')+'</div>'}
function openApplication(id){const a=state.applications.find(x=>x.id===id);if(!a)return;const p=a.payload_json||{};const sv=a.services||p.services||[];document.getElementById('application').innerHTML='<button class="back" onclick="openMain(\'applications\')">'+tr('back')+'</button><div class="detail"><div class="heading"><div><h1>📨 #'+a.id+'</h1><p>'+esc(a.business_name_db||a.business_name||'')+'</p></div>'+status(a.status)+'</div><div class="section"><h3>'+tr('applicationInfo')+'</h3><div class="grid2"><div><b>'+tr('direction')+'</b><div>'+esc(a.master_name_am||a.master_name_ru||a.direction_name||'—')+'</div></div><div><b>'+tr('subcategory')+'</b><div>'+esc(a.category_name_am||a.category_name_ru||a.subcategory_name||'—')+'</div></div><div><b>'+tr('price')+'</b><div>'+esc(a.price??'—')+'</div></div><div><b>'+tr('document')+'</b><div>'+ (a.document_id?status(a.document_status||'pending'):'—')+'</div></div></div></div><div class="section"><h3>'+tr('services')+'</h3><div class="list">'+(sv.length?sv.map(x=>'<div class="item"><div class="row"><b>'+esc(x.name||x.service_name)+'</b><span>'+esc(x.price??'')+' AMD</span></div><div class="muted">'+esc(x.direction_name||'')+' · '+esc(x.subcategory_name||'')+'</div></div>').join(''):'<div class="empty">'+tr('empty')+'</div>')+'</div></div><div class="section"><div class="notice">Եթե գործընթացը ավարտվի հաստատմամբ, արդյունքը դառնում է իրական ընկերություն / ուղղություն / ծառայություն և այլևս չի խառնվում ակտիվ հայտերի հետ։</div></div></div>';setView('application',false)}
function renderOrders(){document.getElementById('orders').innerHTML='<div class="heading"><div><h1>📥 '+tr('orders')+'</h1><p>Պատվերները առանձին աշխատանքային հոսք են և կապված են ընտրված ընկերության հետ։</p></div></div><div class="list">'+(state.bookings.length?state.bookings.map(b=>'<div class="item"><div class="row"><b>#'+b.id+'</b>'+status(b.status)+'</div><div class="muted">'+esc(b.service_name||'')+'</div></div>').join(''):'<div class="empty">'+tr('noOrders')+'</div>')+'</div>'}
function renderNegotiations(){document.getElementById('negotiations').innerHTML='<div class="heading"><div><h1>💬 '+tr('negotiations')+'</h1><p>Բանակցությունները բացվում են առանձին սենյակում՝ առանց ընկերության հիմնական տվյալները խառնելու։</p></div></div><div class="empty">'+tr('noNegotiations')+'</div>'}
function renderSettings(){const s=state.settings||{};const share=s.contact_sharing_enabled!==false;const premium=s.premium_contact_sharing_enabled!==false;document.getElementById('settings').innerHTML='<div class="heading"><div><h1>⚙️ '+tr('settings')+'</h1><p>'+tr('global')+'</p></div></div><div class="detail"><div class="field"><label>Լեզու / Language</label><select onchange="changeLang(this.value)"><option value="hy" '+(state.lang==='hy'?'selected':'')+'>Հայերեն</option><option value="ru" '+(state.lang==='ru'?'selected':'')+'>Русский</option><option value="en" '+(state.lang==='en'?'selected':'')+'>English</option></select></div><div class="section"><h3>📞 Контакты</h3><div class="field"><label>Разрешать передачу контактов клиенту</label><select onchange="saveGeneralSetting(&quot;contact_sharing_enabled&quot;,this.value===&#39;true&#39;)"><option value="true" '+(share?'selected':'')+'>Да</option><option value="false" '+(!share?'selected':'')+'>Нет</option></select></div><div class="field"><label>Premium: передача контактов</label><select onchange="saveGeneralSetting(&quot;premium_contact_sharing_enabled&quot;,this.value===&#39;true&#39;)"><option value="true" '+(premium?'selected':'')+'>Да</option><option value="false" '+(!premium?'selected':'')+'>Нет</option></select></div></div><div class="section"><div class="notice">Общие настройки партнёра действуют для аккаунта. Настройки фирмы, объекта и услуги находятся внутри соответствующей комнаты.</div></div></div>'}
async function saveGeneralSetting(key,value){try{await api('/api/master/0/settings',{method:'POST',body:{[key]:value}});if(!state.settings)state.settings={};state.settings[key]=value;toast('✓ '+tr('saved'))}catch(e){toast(e.message)}}
async function changeLang(v){state.lang=v;applyLang();await saveGeneralSetting('lang',v);renderAll()}
/* Initial */
async function renderAll(){applyLang();try{await loadBusinesses();renderBusinesses();if(state.current)document.getElementById('businessSelect').value=state.current.id}catch(e){toast(e.message)}}
renderAll();
</script>
