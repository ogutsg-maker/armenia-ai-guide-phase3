<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Armenia AI Guide — Ադմինիստրացիա</title>
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<style>html,body{margin:0;width:100%;height:100%;background:#f4f6f8;font:14px system-ui,-apple-system,Segoe UI,sans-serif}#status{padding:32px;text-align:center;color:#64748b}</style>
</head>
<body>
<div id="status">Բեռնում ենք ադմինիստրատորի վահանակը…</div>
<script>
(async()=>{
  try{
    const r=await fetch('/admin_app.html?fresh='+Date.now(),{cache:'no-store',headers:{'Cache-Control':'no-cache'}});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const html=await r.text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('status').textContent='Չհաջողվեց բեռնել ադմինիստրատորի վահանակը։ '+e.message;
  }
})();
</script>
</body>
</html>
