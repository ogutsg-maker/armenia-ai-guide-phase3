<!doctype html><html lang="hy"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Partner cabinet</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
*{box-sizing:border-box}body{font:15px system-ui,-apple-system,sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:900px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.nav{display:flex;gap:6px;flex-wrap:wrap}.nav button,.btn{border:0;border-radius:11px;padding:10px 13px;background:#182033;color:white;font-weight:750;cursor:pointer}.btn.secondary{background:#e9edf4;color:#172033}.card{background:#fff;border:1px solid #e1e6ee;border-radius:18px;padding:14px;margin:9px 0}.muted{color:#687386;font-size:13px}.error{color:#b42318}.success{color:#16794b}.row{display:flex;gap:8px}.row input{flex:1;padding:11px;border:1px solid #d8dee8;border-radius:11px}.chat{background:#e7edf4;border:1px solid #dbe2eb;border-radius:18px;overflow:hidden}.chatHead{background:#fff;padding:12px 14px;border-bottom:1px solid #dfe5ed}.chatTitle{font-weight:800}.chatSub{font-size:12px;color:#687386;margin-top:2px}.messages{height:52vh;min-height:300px;overflow:auto;padding:12px;background:linear-gradient(#eef3f7,#e7edf4)}.msg{padding:9px 12px;border-radius:16px;margin:7px 0;background:#fff;max-width:82%;box-shadow:0 1px 1px #d7dde5}.mine{margin-left:auto;background:#d9fdd3}.msgWho{font-size:11px;font-weight:750;color:#687386;margin-bottom:2px}.msgText{white-space:pre-wrap;word-break:break-word}.system{max-width:94%;margin:10px auto;padding:9px 12px;border-radius:12px;background:#fff7d6;border:1px solid #f0df98;text-align:center;font-size:13px}.agreement{margin:10px 12px;padding:12px;border-radius:14px;background:#fff;border:1px solid #d9e0e8}.composer{display:flex;gap:8px;padding:10px;background:#fff;border-top:1px solid #dfe5ed}.composer input{flex:1;padding:12px;border:1px solid #d8dee8;border-radius:14px}.actions{padding:0 12px 12px;background:#fff}.actions .btn{width:100%}.wait{text-align:center;padding:14px;color:#687386}
</style><div class="wrap"><div class="top"><b>🤝 Armenia AI Guide</b><div class="nav"><button onclick="loadProfile()">🏢</button><button onclick="loadServices()">🛠</button><button onclick="loadNegotiations()">💬</button><button onclick="loadNotifications()">🔔</button><button onclick="servicePrompt()">🤖</button><button onclick="location.href='/welcome.html'">←</button></div></div><div id="app" class="card">Загрузка…</div></div><script>
const tg=(window.Telegram&&window.Telegram.WebApp)?window.Telegram.WebApp:null;if(tg){tg.ready();tg.expand()}const H={'X-Telegram-Init-Data':tg?tg.initData:'','Content-Type':'application/json'};let currentNegotiation=null,pollTimer=null;
async function api(u,o={}){if(!tg||!tg.initData)throw Error('Բացեք կաբինետը Telegram հավելվածից');o.headers={...H,...o.headers};let r=await fetch(u,o),raw=await r.text(),d;try{d=JSON.parse(raw)}catch(_){throw Error('Սերվերի սխալ պատասխան')}if(!r.ok)throw Error(d.error||'request_failed');return d}
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function renderMessages(messages,role){return '<div class="messages" id="messages">'+messages.map(m=>'<div class="msg '+(m.sender_role===role?'mine':'')+'"><div class="msgWho">'+esc(m.sender_role===role?'Вы':(m.sender_role==='partner'?'Партнёр':'Клиент'))+'</div><div class="msgText">'+esc(m.message)+'</div></div>').join('')+'</div>'}
async function loadProfile(){clearInterval(pollTimer);let d=await api('/api/partner/profile');app.innerHTML='<h3>🏢 Мои компании</h3>'+d.companies.map(x=>'<div class="card"><b>'+esc(x.name)+'</b><div class="muted">Компания #'+x.id+'</div></div>').join('')}
async function loadNegotiations(){clearInterval(pollTimer);try{const d=await api('/api/partner/negotiations'),rows=Array.isArray(d.items)?d.items:[];if(!rows.length){app.innerHTML='<h3>💬 Переговоры</h3><div class="muted">Пока нет переговоров.</div>';return}app.innerHTML='<h3>💬 Переговоры</h3>'+rows.map(x=>'<div class="card" onclick="openNegotiation('+Number(x.id)+')" style="cursor:pointer"><b>👤 Клиент</b><div>'+esc(x.service_name||'Услуга')+'</div><div class="muted">'+(x.city?'📍 '+esc(x.city)+' · ':'')+esc(x.status)+'</div>'+(x.last_message?'<div class="muted">💬 '+esc(x.last_message)+'</div>':'')+'<button class="btn" style="margin-top:8px">💬 Открыть чат</button></div>').join('')}catch(e){app.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function loadNotifications(){clearInterval(pollTimer);try{const d=await api('/api/partner/notifications'),rows=Array.isArray(d.items)?d.items:[];if(!rows.length){app.innerHTML='<h3>🔔 Уведомления</h3><div class="muted">Новых уведомлений нет.</div>';return}app.innerHTML='<h3>🔔 Уведомления</h3>'+rows.map(x=>{const p=x.payload||{};let body;if(x.kind==='new_client_request')body='<b>Новый клиентский запрос</b><div>'+esc(p.service_name||'Услуга')+'</div>'+(p.company_name?'<div class="muted">'+esc(p.company_name)+'</div>':'')+(p.city?'<div class="muted">📍 '+esc(p.city)+'</div>':'')+'<div class="row" style="margin-top:10px"><button class="btn" onclick="decideNegotiation('+Number(p.negotiation_id)+',\'interest\')">✅ Мне интересно</button><button class="btn" onclick="decideNegotiation('+Number(p.negotiation_id)+',\'decline\')">❌ Не интересно</button></div>';else if(x.kind==='partner_interested')body='<b>💬 Переговоры активированы</b><div>'+esc(p.service_name||'Услуга')+'</div><button class="btn" style="margin-top:8px" onclick="openNegotiation('+Number(p.negotiation_id)+')">💬 Открыть чат</button>';else body='<b>'+esc(x.kind||'Уведомление')+'</b>';return '<div class="card">'+body+'</div>'}).join('')}catch(e){app.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function decideNegotiation(id,action){try{const d=await api('/api/partner/negotiations/'+id+'/decision',{method:'POST',body:JSON.stringify({action})});if(d.status==='active')openNegotiation(id);else loadNotifications()}catch(e){app.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function openNegotiation(id){clearInterval(pollTimer);currentNegotiation=Number(id);app.innerHTML='<div class="chat"><div id="chatHead" class="chatHead"></div><div id="neg"></div><div class="composer"><input id="messageInput" placeholder="Напишите сообщение клиенту…"><button class="btn" id="sendBtn">➤</button></div><div class="actions"><button class="btn secondary" onclick="loadNegotiations()">← Все переговоры</button></div></div>';document.getElementById('sendBtn').onclick=sendMessage;document.getElementById('messageInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});await loadNegotiation();pollTimer=setInterval(loadNegotiation,3000)}
async function loadNegotiation(){try{const d=await api('/api/negotiations/'+currentNegotiation),n=d.negotiation;document.getElementById('chatHead').innerHTML='<div class="chatTitle">💬 Клиент</div><div class="chatSub">'+esc(n.service_name||'Услуга')+(n.city?' · 📍 '+esc(n.city):'')+'</div>';let body=renderMessages(d.messages||[],d.role);if(n.status==='waiting_partner')body+='<div class="system">Запрос ожидает вашего решения.</div>';if(n.status==='active')body+='<div class="agreement"><b>Переговоры продолжаются</b><div class="muted">Пишите обычными сообщениями. Когда вы договоритесь о цене и условиях, система зафиксирует согласование.</div></div>';if(n.status==='agreed'){body+='<div class="system">✓ Условия согласованы обеими сторонами.</div><div class="agreement"><b>Согласованные условия</b><div>Цена: <b>'+esc(n.agreed_price)+' AMD</b></div><div class="muted">Клиент оформляет бронирование.</div></div>'}if(n.status==='declined'||n.status==='expired'||n.status==='nonresponsive')body+='<div class="system">Диалог завершён.</div>';document.getElementById('neg').innerHTML=body;document.getElementById('messageInput').disabled=n.status!=='active';document.getElementById('sendBtn').disabled=n.status!=='active';const box=document.getElementById('messages');if(box)box.scrollTop=box.scrollHeight}catch(e){neg.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function agreeTerms(){const p=Number(document.getElementById('agreePrice')?.value);if(!p)return;try{await api('/api/negotiations/'+currentNegotiation+'/terms',{method:'POST',body:JSON.stringify({agreed_price:p})});await loadNegotiation()}catch(e){alert(e.message)}}
async function sendMessage(){const input=document.getElementById('messageInput');const button=document.getElementById('sendBtn');const text=input.value.trim();if(!text)return;button.disabled=true;try{await api('/api/negotiations/'+currentNegotiation+'/messages',{method:'POST',body:JSON.stringify({message:text})});input.value='';await loadNegotiation()}catch(e){alert(e.message)}finally{button.disabled=false}}
async function markNotification(id){try{await api('/api/partner/notifications/'+id+'/read',{method:'POST',body:'{}'});loadNotifications()}catch(e){}}
async function loadServices(){clearInterval(pollTimer);let d=await api('/api/partner/services');app.innerHTML='<h3>🛠 Услуги</h3>'+((d.items.length)?d.items.map(x=>'<div class="card"><b>'+esc(x.name)+'</b><div>'+esc(x.price_type)+' · '+esc(x.price_amd)+' AMD</div><div class="muted">'+esc(x.status)+'</div></div>').join(''):'<div>Դեռ ծառայություններ չկան։</div>')}
function servicePrompt(){clearInterval(pollTimer);app.innerHTML='<h3>🤖 AI-Помощник</h3><p>Գրեք, օրինակ՝ «Создай услугу ремонт холодильников от 5000, работаю 10–20, выезжаю по Раздану».</p><div class="row"><input id="txt" placeholder="Ваш запрос"><button class="btn" onclick="preview()">Հասկանալ</button></div><div id="out"></div>'}
async function preview(){try{let d=await api('/api/partner/ai',{method:'POST',body:JSON.stringify({text:txt.value})});const pv=d.result&&d.result.preview?d.result.preview:null;out.innerHTML='<div class="card"><b>🤖 Նախադիտում</b>'+(pv?'<pre>'+esc(JSON.stringify(pv,null,2))+'</pre><button class="btn" onclick="confirmIt()">✓ Հաստատել</button>':'<div>'+esc((d.result&&d.result.answer)||d.error||'')+'</div>')+'</div>'}catch(e){out.textContent=e.message}}
async function confirmIt(){await api('/api/partner/services/confirm',{method:'POST',body:'{}'});out.innerHTML='<div class="card">✓ Հայտը создана. Ожидает проверки admin.</div>';loadServices()}
loadProfile();</script></html>
