<!doctype html><html lang="hy"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Partner cabinet</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{font:15px system-ui;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:900px;margin:auto;padding:14px}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button,.btn{border:0;border-radius:11px;padding:10px 13px;background:#182033;color:white;font-weight:700}.card{background:#fff;border:1px solid #e1e6ee;border-radius:18px;padding:16px;margin:10px 0}.muted{color:#687386}.row{display:flex;gap:8px}.row input{flex:1;padding:11px;border:1px solid #d8dee8;border-radius:11px}.messages{max-height:55vh;overflow:auto}.msg{padding:9px 12px;border-radius:14px;margin:7px 0;background:#eef1f6;max-width:82%}.mine{margin-left:auto;background:#182033;color:#fff}</style><div class="wrap"><h2>🤝 Armenia AI Guide</h2><div class="nav"><button onclick="loadProfile()">🏢 Мои компании</button><button onclick="loadServices()">🛠 Услуги</button><button onclick="loadNegotiations()">💬 Переговоры</button><button onclick="loadNotifications()">🔔 Уведомления</button><button onclick="servicePrompt()">🤖 AI-Помощник</button><button onclick="location.href='/welcome.html'">←</button></div><div id="app" class="card">Загрузка…</div></div><script>
const tg=(window.Telegram&&window.Telegram.WebApp)?window.Telegram.WebApp:null;if(tg){tg.ready();tg.expand()}const H={'X-Telegram-Init-Data':tg?tg.initData:'','Content-Type':'application/json'};let currentNegotiation=null,pollTimer=null;
async function api(u,o={}){if(!tg||!tg.initData)throw Error('Բացեք կաբինետը Telegram հավելվածից');o.headers={...H,...o.headers};let r=await fetch(u,o),raw=await r.text(),d;try{d=JSON.parse(raw)}catch(_){throw Error('Սերվերի սխալ պատասխան')}if(!r.ok)throw Error(d.error||'request_failed');return d}
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
async function loadProfile(){clearInterval(pollTimer);let d=await api('/api/partner/profile');app.innerHTML='<h3>🏢 Мои компании</h3>'+d.companies.map(x=>'<div class="card"><b>'+esc(x.name)+'</b><div class="muted">Компания #'+x.id+'</div></div>').join('')}
async function loadNegotiations(){
 clearInterval(pollTimer);
 try{const d=await api('/api/partner/negotiations'),rows=Array.isArray(d.items)?d.items:[];
 if(!rows.length){app.innerHTML='<h3>💬 Переговоры</h3><div class="muted">Пока нет переговоров.</div>';return}
 app.innerHTML='<h3>💬 Переговоры</h3>'+rows.map(x=>'<div class="card" onclick="openNegotiation('+Number(x.id)+')" style="cursor:pointer"><b>👤 Клиент #'+esc(x.client_telegram_id)+'</b><div>'+esc(x.service_name||'Услуга')+'</div><div class="muted">'+(x.city?'📍 '+esc(x.city):'')+' · статус: '+esc(x.status)+'</div>'+(x.last_message?'<div class="muted">💬 '+esc(x.last_message)+'</div>':'')+'<button class="btn" style="margin-top:8px">💬 Открыть чат</button></div>').join('')
 }catch(e){app.innerHTML='<div>'+esc(e.message)+'</div>'}
}
async function loadNotifications(){clearInterval(pollTimer);try{const d=await api('/api/partner/notifications'),rows=Array.isArray(d.items)?d.items:[];if(!rows.length){app.innerHTML='<h3>🔔 Уведомления</h3><div class="muted">Новых уведомлений нет.</div>';return}app.innerHTML='<h3>🔔 Уведомления</h3>'+rows.map(x=>{const p=x.payload||{};let body;if(x.kind==='new_client_request'){body='<b>Новый клиентский запрос</b><div>'+esc(p.service_name||'Услуга')+'</div>'+(p.company_name?'<div class="muted">'+esc(p.company_name)+'</div>':'')+(p.city?'<div class="muted">📍 '+esc(p.city)+'</div>':'')+(p.price_amd!=null?'<div class="muted">'+esc(p.price_type||'')+' '+esc(p.price_amd)+' AMD</div>':'')+'<div class="muted">Запрос #'+esc(p.request_id)+'</div>'+(x.read_at?'':'<button class="btn" style="margin-top:8px" onclick="markNotification('+Number(x.id)+')">Прочитано</button>')+'<div class="row" style="margin-top:10px"><button class="btn" onclick="decideNegotiation('+Number(p.negotiation_id)+',\'interest\')">✅ Мне интересно</button><button class="btn" onclick="decideNegotiation('+Number(p.negotiation_id)+',\'decline\')">❌ Не интересно</button></div>'}else if(x.kind==='partner_interested'){body='<b>💬 Переговоры активированы</b><div>'+esc(p.service_name||'Услуга')+'</div><button class="btn" style="margin-top:8px" onclick="openNegotiation('+Number(p.negotiation_id)+')">💬 Открыть переговоры</button>'}else{body='<b>'+esc(x.kind||'Уведомление')+'</b><pre>'+esc(JSON.stringify(p,null,2))+'</pre>'}return '<div class="card">'+body+'</div>'}).join('')}catch(e){app.innerHTML='<div>'+esc(e.message)+'</div>'}}
async function decideNegotiation(id,action){try{const d=await api('/api/partner/negotiations/'+id+'/decision',{method:'POST',body:JSON.stringify({action})});if(d.status==='active')openNegotiation(id);else if(d.status==='declined'){app.innerHTML='<h3>🔔 Уведомление</h3><div class="card">❌ Запрос отклонён. Клиентский запрос возвращён в поиск.</div>'}else if(d.expired){app.innerHTML='<h3>🔔 Уведомление</h3><div class="card">⏱ Срок интереса истёк. Запрос возвращён в поиск.</div>'}else loadNotifications()}catch(e){app.innerHTML='<div>'+esc(e.message)+'</div>'}}
async function openNegotiation(id){clearInterval(pollTimer);currentNegotiation=Number(id);app.innerHTML='<h3>💬 Переговоры</h3><div id="neg"></div><div class="row"><input id="messageInput" placeholder="Сообщение клиенту…"><button class="btn" id="sendBtn">➤</button></div><button class="btn" style="margin-top:8px" onclick="loadNotifications()">← Уведомления</button>';sendBtn.onclick=sendMessage;messageInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendMessage()}});await loadNegotiation();pollTimer=setInterval(loadNegotiation,3000)}
async function loadNegotiation(){try{const d=await api('/api/negotiations/'+currentNegotiation),n=d.negotiation;neg.innerHTML='<div class="card"><b>'+esc(n.service_name)+'</b><div class="muted">'+esc(n.company_name||'')+(n.city?' · 📍 '+esc(n.city):'')+'</div><div class="muted">Статус: '+esc(n.status)+'</div></div><div class="messages">'+d.messages.map(m=>'<div class="msg '+(m.sender_role===d.role?'mine':'')+'"><b>'+esc(m.sender_role==='partner'?'Вы':'Клиент')+'</b><br>'+esc(m.message)+'</div>').join('')+'</div>';messageInput.disabled=n.status!=='active';sendBtn.disabled=n.status!=='active'}catch(e){neg.innerHTML='<div>'+esc(e.message)+'</div>'}}
async function sendMessage(){const text=messageInput.value.trim();if(!text)return;sendBtn.disabled=true;try{await api('/api/negotiations/'+currentNegotiation+'/messages',{method:'POST',body:JSON.stringify({message:text})});messageInput.value='';await loadNegotiation()}catch(e){alert(e.message)}finally{sendBtn.disabled=false}}
async function markNotification(id){try{await api('/api/partner/notifications/'+id+'/read',{method:'POST',body:'{}'});loadNotifications()}catch(e){app.innerHTML='<div>'+esc(e.message)+'</div>'}}
async function loadServices(){clearInterval(pollTimer);let d=await api('/api/partner/services');app.innerHTML='<h3>🛠 Услуги</h3>'+((d.items.length)?d.items.map(x=>'<div class="card"><b>'+esc(x.name)+'</b><div>'+esc(x.price_type)+' · '+esc(x.price_amd)+' AMD</div><div class="muted">'+esc(x.status)+'</div></div>').join(''):'<div>Դեռ ծառայություններ չկան։</div>')}
function servicePrompt(){clearInterval(pollTimer);app.innerHTML='<h3>🤖 AI-Помощник</h3><p>Գրեք, օրինակ՝ «Создай услугу ремонт холодильников от 5000, работаю 10–20, выезжаю по Раздану».</p><div class="row"><input id="txt" placeholder="Ваш запрос"><button class="btn" onclick="preview()">Հասկանալ</button></div><div id="out"></div>'}
async function preview(){try{let d=await api('/api/partner/ai',{method:'POST',body:JSON.stringify({text:txt.value})});const pv=d.result&&d.result.preview?d.result.preview:null;out.innerHTML='<div class="card"><b>🤖 Նախադիտում</b>'+(pv?'<pre>'+esc(JSON.stringify(pv,null,2))+'</pre><button class="btn" onclick="confirmIt()">✓ Հաստատել</button>':'<div>'+esc((d.result&&d.result.answer)||d.error||'')+'</div>')+'</div>'}catch(e){out.textContent=e.message}}
async function confirmIt(){await api('/api/partner/services/confirm',{method:'POST',body:'{}'});out.innerHTML='<div class="card">✓ Հայտը ստեղծված է։ Սպասում է admin ստուգմանը։</div>';loadServices()}
loadProfile();</script></html>
