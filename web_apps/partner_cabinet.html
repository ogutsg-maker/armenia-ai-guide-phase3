<!doctype html><html lang="hy"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Partner cabinet</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{font:15px system-ui;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:900px;margin:auto;padding:14px}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button,.btn{border:0;border-radius:11px;padding:10px 13px;background:#182033;color:white;font-weight:700}.card{background:#fff;border:1px solid #e1e6ee;border-radius:18px;padding:16px;margin:10px 0}.muted{color:#687386}.row{display:flex;gap:8px}.row input{flex:1;padding:11px;border:1px solid #d8dee8;border-radius:11px}</style><div class="wrap"><h2>🤝 Armenia AI Guide</h2><div class="nav"><button onclick="loadProfile()">🏢 Мои компании</button><button onclick="loadServices()">🛠 Услуги</button><button onclick="servicePrompt()">🤖 AI-Помощник</button><button onclick="location.href='/welcome.html'">←</button></div><div id="app" class="card">Загрузка…</div></div><script>const tg=Telegram.WebApp;tg.ready();tg.expand();const H={'X-Telegram-Init-Data':tg.initData,'Content-Type':'application/json'};async function api(u,o={}){o.headers={...H,...o.headers};let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error);return d}async function loadProfile(){let d=await api('/api/partner/profile');app.innerHTML='<h3>🏢 Мои компании</h3>'+d.companies.map(x=>'<div class="card"><b>'+x.name+'</b><div class="muted">Компания #'+x.id+'</div></div>').join('')}async function loadServices(){let d=await api('/api/partner/services');app.innerHTML='<h3>🛠 Услуги</h3>'+((d.items.length)?d.items.map(x=>'<div class="card"><b>'+x.name+'</b><div>'+x.price_type+' · '+x.price_amd+' AMD</div><div class="muted">'+x.status+'</div></div>').join(''):'<div>Դեռ ծառայություններ չկան։</div>')}function servicePrompt(){app.innerHTML='<h3>🤖 AI-Помощник</h3><p>Գրեք, օրինակ՝ «Создай услугу ремонт холодильников от 5000, работаю 10–20, выезжаю по Раздану».</p><div class="row"><input id="txt" placeholder="Ваш запрос"><button class="btn" onclick="preview()">Հասկանալ</button></div><div id="out"></div>'}async function preview(){try{let d=await api('/api/partner/ai',{method:'POST',body:JSON.stringify({text:txt.value})}); const pv=d.result&&d.result.preview?d.result.preview:null; out.innerHTML='<div class="card"><b>🤖 Նախադիտում</b>'+(pv?'<pre>'+JSON.stringify(pv,null,2)+'</pre><button class="btn" onclick="confirmIt()">✓ Հաստատել</button>':'<div>'+((d.result&&d.result.answer)||d.error||'')+'</div>')+'</div>'}catch(e){out.textContent=e.message}}async function confirmIt(){let d=await api('/api/partner/services/confirm',{method:'POST',body:'{}'});out.innerHTML='<div class="card">✓ Հայտը ստեղծված է։ Սպասում է admin ստուգմանը։</div>';loadServices()}loadProfile();</script></html>
