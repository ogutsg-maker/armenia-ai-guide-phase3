<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Armenia AI Guide — Negotiations</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#080c18;color:#fff;font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:850px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.brand{font-size:20px;font-weight:900}.muted{color:#aeb7c8}.panel{background:#121a2a;border:1px solid #26334b;border-radius:18px;padding:14px;margin-bottom:12px}.item{border:1px solid #2a3850;border-radius:14px;padding:13px;margin:8px 0;background:#0d1422}.btn{border:0;border-radius:11px;padding:10px 13px;background:#8f82ff;color:#fff;font-weight:800;cursor:pointer}.secondary{background:#26334b}.messages{max-height:48vh;overflow:auto;margin:10px 0}.msg{padding:10px 12px;border-radius:13px;background:#202c40;margin:7px 0;white-space:pre-wrap}.me{background:#5148a5;margin-left:15%}.composer{display:flex;gap:8px}.composer textarea{flex:1;min-height:46px;background:#0b1120;color:#fff;border:1px solid #33425d;border-radius:11px;padding:10px;font:inherit}.hidden{display:none!important}.tag{display:inline-block;padding:4px 8px;border-radius:20px;background:#26334b;margin-top:5px;font-size:11px}</style></head><body><div class="wrap"><div class="top"><div><div class="brand">✦ Armenia AI Guide</div><div class="muted">Գործընկերոջ բանակցություններ</div></div><button class="btn secondary" onclick="location.href='master_cabinet.html'">Կաբինետ</button></div><div class="panel"><b>Նոր հարցումներ</b><div id="list" class="muted">Բեռնվում է…</div></div><div id="chatPanel" class="panel hidden"><b id="title"></b><div id="chat" class="messages"></div><div class="composer"><textarea id="text" placeholder="Պատասխանեք հաճախորդին…"></textarea><button class="btn" onclick="reply()">Ուղարկել</button></div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn" onclick="agree()">✅ Համաձայնել</button><button class="btn secondary" onclick="refresh()">↻ Թարմացնել</button></div></div></div><script>const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const initData=tg?.initData||'';let nid=null;function H(){return {'Content-Type':'application/json','X-Telegram-Init-Data':initData}}async function api(u,o={}){o.headers={...H(),...(o.headers||{})};const r=await fetch(u,o),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||('HTTP '+r.status));return d}async function load(){try{const r=await api('/api/market/partner/negotiations');const l=document.getElementById('list');if(!r.items.length){l.textContent='Ակտիվ բանակցություններ չկան։';return}l.innerHTML='';r.items.forEach(x=>{const e=document.createElement('div');e.className='item';e.innerHTML='<b>№'+x.id+' · '+esc(x.service_name||'Ծառայություն')+'</b><div class="muted">'+esc(x.summary||'')+(x.city?' · '+esc(x.city):'')+'</div><span class="tag">'+esc(x.status)+'</span><br><button class="btn" style="margin-top:8px" onclick="openN('+x.id+')">Բացել բանակցությունը</button>';l.appendChild(e)})}catch(e){document.getElementById('list').textContent='Սխալ՝ '+e.message}}async function openN(id){nid=id;const r=await api('/api/market/partner/negotiation/'+id);document.getElementById('chatPanel').classList.remove('hidden');document.getElementById('title').textContent='Բանակցություն №'+id;render(r.messages);document.getElementById('chatPanel').scrollIntoView({behavior:'smooth'})}function render(ms){const c=document.getElementById('chat');c.innerHTML='';ms.forEach(m=>{const e=document.createElement('div');e.className='msg '+(m.sender_role==='partner'?'me':'');e.textContent=m.message;c.appendChild(e)});c.scrollTop=c.scrollHeight}async function reply(){if(!nid)return;const t=document.getElementById('text').value.trim();if(!t)return;document.getElementById('text').value='';const r=await api('/api/market/partner/negotiation/'+nid+'/reply',{method:'POST',body:JSON.stringify({message:t})});render(r.messages);load()}async function agree(){if(!nid)return;await api('/api/market/partner/negotiation/'+nid+'/agree',{method:'POST',body:'{}'});await openN(nid);load()}async function refresh(){if(nid)await openN(nid);await load()}function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}load();setInterval(refresh,5000)</script></body></html>
