<!doctype html><html lang="hy"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{font:15px system-ui;background:#f5f7fb;color:#172033}.wrap{max-width:1000px;margin:auto;padding:15px}.card{background:#fff;border:1px solid #e1e6ee;border-radius:18px;padding:15px;margin:10px 0}.btn{border:0;border-radius:10px;padding:10px 12px;margin-right:6px;font-weight:800}</style><div class="wrap"><h2>👑 Armenia AI Guide — Admin</h2><div class="card"><input id="q" style="width:70%;padding:11px" placeholder="Сколько AI операций сегодня?"><button class="btn" onclick="ask()">🤖 AI</button><div id="answer"></div></div><div class="card"><h3>📨 Заявки на услуги</h3><div id="list">Загрузка…</div></div></div><script>const tg=Telegram.WebApp;tg.ready();tg.expand();const H={'X-Telegram-Init-Data':tg.initData,'Content-Type':'application/json'};async function api(u,o={}){o.headers={...H,...o.headers};let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error);return d}async function load(){let d=await api('/api/admin/services');list.innerHTML=d.items.map(x=>'<div class="card"><b>#'+x.id+' '+x.name+'</b><div>'+x.price_type+' '+x.price_amd+' AMD · '+x.company_name+'</div><button class="btn" onclick="dec('+x.id+',\'approve\')">✓ Approve</button><button class="btn" onclick="dec('+x.id+',\'reject\')">✕ Reject</button></div>').join('')||'Нет заявок'}async function dec(id,a){await api('/api/admin/services/'+id+'/decision',{method:'POST',body:JSON.stringify({action:a})});load()}async function ask(){let d=await api('/api/admin/ai',{method:'POST',body:JSON.stringify({text:q.value})});answer.textContent=d.answer||JSON.stringify(d)}load();</script></html>
